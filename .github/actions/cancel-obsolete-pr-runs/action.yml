name: Cancel obsolete PR workflow runs
description: >
  Cancel active runs of this same workflow and PR when their head SHA is no
  longer current. Call from an existing first-attempt job so the cancellation
  closes the post-admission race without creating another billed runner job.

inputs:
  pr-number:
    description: Pull request whose current head is authoritative.
    required: true
  current-head-sha:
    description: Current pull-request head SHA.
    required: true
  head-ref:
    description: Same-repository pull-request head branch.
    required: true
  github-token:
    description: Token with actions:write permission in the calling job.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Cancel obsolete active runs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        CURRENT_HEAD_SHA: ${{ inputs.current-head-sha }}
        HEAD_REF: ${{ inputs.head-ref }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const activeStatuses = new Set(["queued", "in_progress", "pending", "waiting"]);
          const prNumber = Number(process.env.PR_NUMBER);
          const currentHeadSha = process.env.CURRENT_HEAD_SHA;
          const headRef = process.env.HEAD_REF;
          const repoFullName = `${context.repo.owner}/${context.repo.repo}`;

          try {
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const obsoleteRuns = new Map();
            const addIfObsolete = (run) => {
              const samePullRequest = (run.pull_requests || []).some((pull) => pull.number === prNumber);
              const sameRepositoryBranch =
                run.head_repository?.full_name === repoFullName && run.head_branch === headRef;
              if (
                run.id !== context.runId &&
                run.workflow_id === currentRun.workflow_id &&
                activeStatuses.has(run.status) &&
                run.head_sha !== currentHeadSha &&
                (samePullRequest || sameRepositoryBranch)
              ) {
                obsoleteRuns.set(run.id, run);
              }
            };

            // The first parent is the previous PR head for the normal one-commit
            // agent push. Its check runs expose run IDs immediately, while the
            // workflow-run list can lag behind the synchronize event.
            const candidateHeadShas = new Set();
            if (context.payload.before && context.payload.before !== currentHeadSha) {
              candidateHeadShas.add(context.payload.before);
            }
            try {
              const { data: currentCommit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: currentHeadSha,
              });
              const firstParentSha = currentCommit.parents[0]?.sha;
              if (firstParentSha) {
                candidateHeadShas.add(firstParentSha);
              }
            } catch (error) {
              core.warning(`Could not resolve current head's first parent: ${error.message}`);
            }

            for (const candidateHeadSha of candidateHeadShas) {
              const { data: checkResponse } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: candidateHeadSha,
                per_page: 100,
              });
              const checkRuns = checkResponse.check_runs;
              const candidateRunIds = new Set();
              for (const checkRun of checkRuns) {
                const match = checkRun.details_url?.match(/\/actions\/runs\/(\d+)/);
                // A completed guard check can belong to a workflow whose next
                // expensive job is only queued. Check state is not run state.
                if (match) {
                  candidateRunIds.add(Number(match[1]));
                }
              }
              for (const runId of candidateRunIds) {
                try {
                  const { data: run } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: runId,
                  });
                  addIfObsolete(run);
                } catch (error) {
                  core.warning(`Could not inspect previous-head run ${runId}: ${error.message}`);
                }
              }
            }

            // Fallback covers reopened PRs and runs already visible in the
            // workflow index. The map de-duplicates both discovery paths.
            const indexedRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: currentRun.workflow_id,
                event: "pull_request",
                branch: headRef,
                per_page: 100,
            });
            for (const run of indexedRuns) {
              addIfObsolete(run);
            }
            core.info(`Found ${obsoleteRuns.size} obsolete active run(s)`);

            for (const run of obsoleteRuns.values()) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                await new Promise((resolve) => setTimeout(resolve, 2000));
                const { data: afterCancel } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                if (activeStatuses.has(afterCancel.status)) {
                  await github.rest.actions.forceCancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  core.notice(
                    `Force-cancelled obsolete ${run.head_sha} run ${run.id}; PR #${prNumber} is ${currentHeadSha}`,
                  );
                } else {
                  core.notice(`Cancelled obsolete ${run.head_sha} run ${run.id}; PR #${prNumber} is ${currentHeadSha}`);
                }
              } catch (error) {
                // A run may finish between listing and cancellation. Validation
                // remains authoritative even when cost cleanup races or fails.
                core.warning(`Could not cancel obsolete run ${run.id}: ${error.message}`);
              }
            }
          } catch (error) {
            // Cost cleanup is fail-open: an API outage must not suppress the
            // current head's terminal validation.
            core.warning(`Could not inspect obsolete workflow runs: ${error.message}`);
          }
