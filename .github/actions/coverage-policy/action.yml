name: Decide coverage admission
description: Opt-in PR coverage and weekly main coverage, independent of test selection.
inputs:
  explicit:
    description: Explicit manual or reusable-workflow coverage request.
    default: 'false'
outputs:
  enabled:
    description: Whether to collect and publish complete coverage.
    value: ${{ steps.policy.outputs.enabled }}
  marker:
    description: Artifact name to record successful coverage on main.
    value: ${{ steps.policy.outputs.marker }}
  reason:
    description: Why coverage was enabled or skipped.
    value: ${{ steps.policy.outputs.reason }}
runs:
  using: composite
  steps:
    - id: policy
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        COVERAGE_ACTION_PATH: ${{ github.action_path }}
        COVERAGE_EXPLICIT: ${{ inputs.explicit }}
      with:
        script: |
          const path = require('node:path');
          const decide = require(path.resolve(process.env.COVERAGE_ACTION_PATH, '../../../scripts/ci/coverage-policy.cjs'));
          await decide({github, context, core, explicit: process.env.COVERAGE_EXPLICIT === 'true'});
