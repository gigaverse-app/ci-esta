name: Learn pytest file durations
description: Convert successful JUnit evidence to per-file scheduling hints and retain the reports. Never grants test reuse.
inputs:
  junit-pattern:
    description: Glob of disjoint successful JUnit reports, relative to the checkout.
    required: true
  artifact-name:
    description: Unique artifact name for this lane and matrix variant.
    required: true
  output:
    description: Destination scheduling hint manifest.
    default: .ci-test-durations.json
runs:
  using: composite
  steps:
    - name: Learn file costs
      shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
        PYTHONPATH: ${{ github.action_path }}/../../../src
        INPUT_JUNIT_PATTERN: ${{ inputs.junit-pattern }}
        INPUT_TIMING_OUTPUT: ${{ inputs.output }}
      run: uv run --no-project --python 3.14 --with 'pydantic>=2.11,<3' --with 'defusedxml>=0.7,<1' --with "$(python "$SHARED_ACTION_PATH/../../../scripts/ci/pytest_selective_requirement.py")" python -m ci_esta.testing.timing_feedback
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output }}
          ${{ inputs.junit-pattern }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 21
