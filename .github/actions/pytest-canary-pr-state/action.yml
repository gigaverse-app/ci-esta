name: Update pytest canary PR state
description: >-
  Add or clear the server-side pytest-red label only when the caller's tested
  commit is still the pull request head. Callers decide from terminal JUnit
  evidence when to mark red; only the authoritative full matrix may mark green.

inputs:
  state:
    description: Desired authoritative state, either red or green.
    required: true
  expected-head-sha:
    description: Tested commit SHA; stale runs leave state unchanged.
    required: true
  pull-request-number:
    description: Pull request whose state should be updated.
    required: true
  github-token:
    description: Token with pull-request write permission.
    required: false
    default: ${{ github.token }}
  label:
    description: Server-side label used to admit the next canary run.
    required: false
    default: ci:pytest-red

outputs:
  changed:
    description: Whether this invocation added or removed the label.
    value: ${{ steps.state.outputs.changed }}
  stale:
    description: Whether the expected SHA was no longer the pull request head.
    value: ${{ steps.state.outputs.stale }}

runs:
  using: composite
  steps:
    - name: Compare and set pytest canary PR state
      id: state
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        LABEL: ${{ inputs.label }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        STATE: ${{ inputs.state }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const state = process.env.STATE;
          if (state !== "red" && state !== "green") {
            core.setFailed(`Unsupported pytest canary PR state: ${state}`);
            return;
          }

          const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
          if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
            core.setFailed(`Invalid pull request number: ${process.env.PULL_REQUEST_NUMBER}`);
            return;
          }

          const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
          const label = process.env.LABEL;
          const { data: pull } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pullNumber,
          });

          // This compare-and-set is the enforcement point: obsolete runs can
          // never add or clear state for a newer pull-request commit.
          if (pull.head.sha !== expectedHeadSha) {
            core.notice(`Stale run ${expectedHeadSha}; current head is ${pull.head.sha}. State unchanged.`);
            core.setOutput("changed", "false");
            core.setOutput("stale", "true");
            return;
          }

          core.setOutput("stale", "false");
          const hasLabel = pull.labels.some((item) => item.name === label);
          if (state === "red" && !hasLabel) {
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: "d73a4a",
                  description: "Retry previous terminal pytest failures before the full matrix",
                });
              } catch (createError) {
                // Concurrent failed shards may both observe a missing label.
                if (createError.status !== 422) throw createError;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              labels: [label],
            });
            core.setOutput("changed", "true");
            return;
          }

          if (state === "green" && hasLabel) {
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                name: label,
              });
            } catch (error) {
              // A concurrent successful run may already have removed it.
              if (error.status !== 404) throw error;
            }
            core.setOutput("changed", "true");
            return;
          }

          core.setOutput("changed", "false");
