name: Plan previous pytest failure canary
description: Select whole test files with terminal failures from available prior-run JUnit artifacts.

inputs:
  artifact-directory:
    description: Directory containing downloaded JUnit shard artifacts from the prior failed run.
    required: true
  junit-pattern:
    description: Glob relative to artifact-directory for JUnit XML files.
    required: true
  junit-name-template:
    description: Expected shard report basename with one {shard} placeholder.
    required: false
    default: junit-group-{shard}.xml
  shard-count:
    description: Expected prior-run JUnit artifact count, used to report completeness.
    required: true
  max-files:
    description: Maximum whole failing files to include in the canary.
    required: false
    default: "5"
  working-directory:
    description: Current consumer checkout used to discard deleted, renamed, or escaping test paths.
    required: false
    default: "."
  output:
    description: Newline-delimited pytest path file to write.
    required: false
    default: pytest-failure-canary.txt

outputs:
  canary-file:
    description: Newline-delimited file containing pytest paths.
    value: ${{ steps.plan.outputs.canary_file }}
  selected-file-count:
    description: Number of whole test files selected for the bounded canary.
    value: ${{ steps.plan.outputs.selected_file_count }}
  failing-file-count:
    description: Number of distinct files with terminal failures in the prior run.
    value: ${{ steps.plan.outputs.failing_file_count }}
  terminal-failure-count:
    description: Number of failed or errored testcases observed in valid reports, including unrunnable paths.
    value: ${{ steps.plan.outputs.terminal_failure_count }}
  has-files:
    description: Whether the prior reports contain runnable failed test files.
    value: ${{ steps.plan.outputs.has_files }}
  truncated:
    description: Whether the file cap omitted any runnable prior failing files.
    value: ${{ steps.plan.outputs.truncated }}
  report-count:
    description: Number of prior-run JUnit shard reports found.
    value: ${{ steps.plan.outputs.report_count }}
  valid-report-count:
    description: Number of safely parsed JUnit shard reports.
    value: ${{ steps.plan.outputs.valid_report_count }}
  invalid-report-count:
    description: Number of found reports that were malformed, unsafe, or not JUnit XML.
    value: ${{ steps.plan.outputs.invalid_report_count }}
  distinct-shard-count:
    description: Number of expected shard report identities found without assuming raw count means completeness.
    value: ${{ steps.plan.outputs.distinct_shard_count }}
  stale-file-count:
    description: Number of prior failing paths absent from the current checkout.
    value: ${{ steps.plan.outputs.stale_file_count }}
  invalid-path-count:
    description: Number of terminal testcases whose paths were missing or unsafe.
    value: ${{ steps.plan.outputs.invalid_path_count }}
  artifacts-complete:
    description: Whether every expected shard basename was found exactly once and parsed safely.
    value: ${{ steps.plan.outputs.artifacts_complete }}

runs:
  using: composite
  steps:
    # Test selection must not replace a caller's deliberately pinned installer.
    # Reuse the executable already on PATH; bootstrap only for standalone callers.
    - name: Discover caller uv
      id: caller-uv
      shell: bash
      run: |
        if uv_path=$(type -P uv) && [ -x "$uv_path" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - if: ${{ steps.caller-uv.outputs.available != 'true' }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false

    - name: Plan whole-file pytest canary
      id: plan
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../src
        INPUT_ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        INPUT_JUNIT_PATTERN: ${{ inputs.junit-pattern }}
        INPUT_JUNIT_NAME_TEMPLATE: ${{ inputs.junit-name-template }}
        INPUT_SHARD_COUNT: ${{ inputs.shard-count }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: uv run --no-project --python 3.14 --with "pydantic>=2.11,<3" --with "defusedxml>=0.7,<0.8" python -m ci_esta.testing.canary_action
