name: Aggregate pytest timing artifacts
description: Merge duration manifests, summarize JUnit time, and optionally enforce a generated coverage XML floor.

inputs:
  artifact-directory:
    description: Directory containing downloaded shard artifacts.
    required: true
  duration-pattern:
    description: Glob relative to artifact-directory for duration manifests.
    required: true
  junit-pattern:
    description: Glob relative to artifact-directory for JUnit XML files.
    required: true
  shard-count:
    description: Exact number of duration and JUnit artifacts required.
    required: true
  duration-output:
    description: Path where the merged duration manifest is written.
    required: false
    default: .test_durations
  coverage-xml:
    description: Optional generated coverage.py XML file to validate.
    required: false
    default: ""
  coverage-fail-under:
    description: Required percentage when coverage-xml is provided.
    required: false
    default: ""

outputs:
  merged_tests:
    description: Number of tests in the merged duration manifest.
    value: ${{ steps.aggregate.outputs.merged_tests }}
  total_test_time:
    description: Sum of JUnit shard durations, formatted for display.
    value: ${{ steps.aggregate.outputs.total_test_time }}
  wall_time:
    description: Slowest JUnit shard duration, formatted for display.
    value: ${{ steps.aggregate.outputs.wall_time }}
  coverage_percent:
    description: Validated coverage percentage, or blank when coverage validation is disabled.
    value: ${{ steps.aggregate.outputs.coverage_percent }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false

    - name: Aggregate pytest artifacts
      id: aggregate
      shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
        PYTHONPATH: ${{ github.action_path }}/../../../src
        INPUT_ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        INPUT_DURATION_PATTERN: ${{ inputs.duration-pattern }}
        INPUT_JUNIT_PATTERN: ${{ inputs.junit-pattern }}
        INPUT_SHARD_COUNT: ${{ inputs.shard-count }}
        INPUT_DURATION_OUTPUT: ${{ inputs.duration-output }}
        INPUT_COVERAGE_XML: ${{ inputs.coverage-xml }}
        INPUT_COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
      run: uv run --no-project --python 3.14 --with "pydantic>=2.11,<3" --with "defusedxml>=0.7,<0.8" --with "$(python3 "$SHARED_ACTION_PATH/../../../scripts/ci/pytest_selective_requirement.py")" python -m ci_esta.testing.action
