name: Resolve incremental PR base
description: >
  Reuse the newest fresh, successful ancestor previously validated by this
  workflow for this exact pull request. Every uncertain case falls back to the
  supplied PR base so callers scan more rather than skip unproven work.

inputs:
  fallback-base-sha:
    description: Pull request base SHA used when no reusable success is proven.
    required: true
  head-sha:
    description: Current pull request head SHA.
    required: true
  head-ref:
    description: Current pull request branch.
    required: true
  pr-number:
    description: Pull request number whose successful runs may be reused.
    required: true
  evidence-job-name:
    description: >
      Stable job name (or reusable-workflow suffix) that must have concluded
      successfully in a reusable run. A caller prefix such as `validate / `
      is ignored.
    required: true
  cancelled-run-evidence-job-patterns:
    description: >
      Newline-delimited glob patterns for every scanner job that must have
      succeeded before a cancelled workflow can be reused. Empty preserves
      the default fail-open behavior: cancelled workflows are not reusable.
    required: false
    default: ""
  max-age-hours:
    description: Maximum age of reusable evidence; defaults to the weekly full-scan cadence.
    required: false
    default: "168"
  github-token:
    description: Token with actions:read, checks:read, and contents:read permissions.
    required: false
    default: ${{ github.token }}

outputs:
  base-sha:
    description: Proven successful ancestor, or fallback-base-sha.
    value: ${{ steps.resolve.outputs.base-sha }}
  reused:
    description: Whether base-sha came from a prior successful workflow run.
    value: ${{ steps.resolve.outputs.reused }}

runs:
  using: composite
  steps:
    - name: Find latest reusable PR success
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        FALLBACK_BASE_SHA: ${{ inputs.fallback-base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        HEAD_REF: ${{ inputs.head-ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
        EVIDENCE_JOB_NAME: ${{ inputs.evidence-job-name }}
        CANCELLED_RUN_EVIDENCE_JOB_PATTERNS: ${{ inputs.cancelled-run-evidence-job-patterns }}
        MAX_AGE_HOURS: ${{ inputs.max-age-hours }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { resolveIncrementalPrBase } = require(`${process.env.GITHUB_ACTION_PATH}/resolve.cjs`);
          const result = await resolveIncrementalPrBase({
            github,
            context,
            core,
            fallbackBaseSha: process.env.FALLBACK_BASE_SHA,
            headSha: process.env.HEAD_SHA,
            headRef: process.env.HEAD_REF,
            pullRequestNumber: Number(process.env.PR_NUMBER),
            evidenceJobName: process.env.EVIDENCE_JOB_NAME,
            cancelledRunEvidenceJobPatterns: process.env.CANCELLED_RUN_EVIDENCE_JOB_PATTERNS
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean),
            maxAgeHours: Number(process.env.MAX_AGE_HOURS),
          });
          core.setOutput("base-sha", result.baseSha);
          core.setOutput("reused", result.reused ? "true" : "false");
