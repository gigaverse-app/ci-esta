name: Resolve completed pytest evidence
description: Find independent pytest proof using the shared same-PR ancestor discovery policy.
inputs:
  plan-job-name:
    description: Successful planner job required before reusing pytest.
    required: true
  test-job-pattern:
    description: Pytest job glob; failed reuse requires N concurrent shards in its name.
    required: true
  completion-step-name:
    description: Non-tolerated step published only after exhaustive shard completion.
    default: Record reusable pytest completion
  success-status-context:
    description: Optional run-bound Default gate passed status, including zero-test success.
    default: ''
  github-token:
    description: Token with actions, checks, statuses and contents read permissions.
    default: ${{ github.token }}
outputs:
  sha:
    description: Independently successful pytest ancestor.
    value: ${{ steps.resolve.outputs.sha }}
  failed-sha:
    description: Failed candidate; NOT reusable until all failure artifacts validate.
    value: ${{ steps.resolve.outputs.failed-sha }}
  failed-run-id:
    description: Run containing candidate failure artifacts.
    value: ${{ steps.resolve.outputs.failed-run-id }}
  failed-shard-count:
    description: Exact number of candidate shard reports required.
    value: ${{ steps.resolve.outputs.failed-shard-count }}
runs:
  using: composite
  steps:
    - id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        PLAN_JOB_NAME: ${{ inputs.plan-job-name }}
        TEST_JOB_PATTERN: ${{ inputs.test-job-pattern }}
        COMPLETION_STEP_NAME: ${{ inputs.completion-step-name }}
        SUCCESS_STATUS_CONTEXT: ${{ inputs.success-status-context }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pr = context.payload.pull_request;
          if (!pr || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
          const { resolveIncrementalPrBase } = require(`${process.env.GITHUB_ACTION_PATH}/../resolve-incremental-pr-base/resolve.cjs`);
          const result = await resolveIncrementalPrBase({
            github, context, core, fallbackBaseSha: pr.base.sha, headSha: pr.head.sha,
            headRef: pr.head.ref, pullRequestNumber: pr.number,
            evidenceJobName: process.env.TEST_JOB_PATTERN,
            pytestEvidence: {
              planJobName: process.env.PLAN_JOB_NAME,
              completionStepName: process.env.COMPLETION_STEP_NAME,
              successStatusContext: process.env.SUCCESS_STATUS_CONTEXT,
            },
          });
          core.setOutput('sha', result.reused ? result.baseSha : '');
          core.setOutput('failed-sha', result.failedSha || '');
          core.setOutput('failed-run-id', result.failedRunId || '');
          core.setOutput('failed-shard-count', result.failedShardCount || '');
