name: Resolve security trigger
description: >
  Decide whether a security workflow (Trivy, Semgrep, ...) should run, based on
  the same triggers the non-default test framework uses: a PR label, a write+
  collaborator PR comment, a push, or a manual dispatch. Consumers may also
  opt into automatic same-repository pull requests. Emits should_run, ref,
  pr_number and mode so consumers don't re-implement the (subtle) permission
  and fork-safety logic in every security workflow.

# Used by both gigaverse-ai and gigaverse-backend, by both their Trivy and
# Semgrep workflows. Keep the trigger surface identical to
# docs/testing/expensive-test-policy.md in the consumer repos.

inputs:
  source-excluded-paths:
    description: Newline-separated directories already owned by the CI security lane; excludes only diff source scans.
    default: ""
  inventory-job-name:
    description: Independent inventory completion job; enables input-bound evidence.
    default: ""
  inventory-inputs:
    description: Newline-separated literal inventory files and directories; defaults to dependency-paths.
    default: ""
  dependency-token:
    description: Read token for resolving equivalent backend-common package pins.
    default: ""
  changes-file:
    description: Optional complete JSON file evidence bound to the resolved base and head; invalid evidence retains all scans.
    default: ""
  security-label:
    description: PR label that opts a PR into the scan.
    required: false
    default: "risk:security"
  require-same-repo:
    description: >
      When 'true', refuse to run for PRs from forks (head repo != this repo).
      Set this for scans that build images and therefore need same-repo build
      secrets (Trivy); leave 'false' for read-only source scans (Semgrep).
    required: false
    default: "false"
  automatic-same-repo-pull-requests:
    description: >
      When 'true', run automatically for opened, reopened and synchronized
      pull requests, including drafts, whose head branch belongs to this repository.
      Readiness changes allocate no validation. Bot and fork PRs remain excluded. The
      default keeps the existing label/comment opt-in policy unchanged.
    required: false
    default: "false"
  unchanged-dependency-paths:
    description: >-
      Whitespace-separated dependency paths proven not to change what is installed, such as a lock
      whose only edit moves a first-party pin between byte-identical trees (test-impact's
      dependencies-unchanged). They stop counting as dependency changes, but only for
      `unchanged-dependency-base`: a proof against another base says nothing about this diff.
    default: ""
  unchanged-dependency-base:
    description: The base the unchanged-dependency proof was made against (test-impact's `base` output).
    default: ""
  incremental-evidence:
    description: >-
      'false' skips the search for an earlier same-PR run whose scan can shrink the diff, and
      diffs from the PR base instead. For callers that read only should_run (an image gate),
      the search is pure latency: it lists and inspects every earlier run of the workflow.
    default: "true"
  automatic-pr-evidence-step-name:
    description: Optional successful top-level step required inside a combined evidence job; prevents skipped scans being reused.
    default: ""
  automatic-pr-evidence-job-name:
    description: >
      Stable job name or reusable-workflow suffix that proves an earlier
      automatic PR security run actually scanned code. A workflow-level
      success with all scan jobs skipped is not reusable evidence.
    required: false
    default: "semgrep-oss/scan"
  automatic-pr-cancelled-evidence-job-patterns:
    description: >
      Newline-delimited job-name globs that must all have succeeded before a
      cancelled automatic PR workflow can be reused. The defaults require
      both Semgrep and Trivy, independent of consumer-specific job prefixes.
    required: false
    default: |
      *Semgrep*
      *Trivy*
  automatic-pr-ignored-paths:
    description: >
      Newline-delimited exact paths that cannot change a scanner verdict.
      Automatic PR deltas containing only these generated metadata files emit
      semgrep_changed=false before the Semgrep runner is allocated.
    required: false
    default: |
      .github/backend-common-bump.json
      .github/backend-common-ref
  dependency-paths:
    description: >
      Newline-delimited path patterns (exact paths, `dir/` prefixes, or globs
      with `*`/`**`) that define a scan's dependency inputs — lockfiles,
      Dockerfiles, package manifests. When set, the action compares the diff
      of routine events (push, automatic same-repo PRs) against these patterns
      and emits deps_changed so inventory scans (Trivy) can skip runs whose
      inputs did not move. Explicit requests (label, comment, dispatch,
      schedule) always emit deps_changed=true: a human asking for a scan gets
      the full answer. Empty (the default) also always emits true, so callers
      that don't opt in keep their current behavior.
    required: false
    default: ""
  prose-paths:
    description: >
      Known prose paths (exact paths, directory prefixes, or globs). A complete
      prose-only diff still requires secret detection but not source analysis.
      Runtime prompts/templates are deliberately not included by default.
    required: false
    default: |
      docs/**/*.md
      plugins/**/SKILL.md
      .agents/skills/**/*.md
      .claude/skills/**/*.md
  github-token:
    description: >
      Token used for collaborator checks and prior-run discovery. Automatic PR
      mode requires actions:read, checks:read, and contents:read.
    required: false
    default: ${{ github.token }}

outputs:
  inventory-receipt:
    description: Step name to record only after every inventory scan succeeds.
    value: ${{ steps.context.outputs.inventory-receipt }}
  should_run:
    description: "'true' if the scan should run for this event."
    value: ${{ steps.context.outputs.should_run }}
  ref:
    description: Git ref/SHA the scan should check out (PR head for PR triggers).
    value: ${{ steps.context.outputs.ref }}
  pr_number:
    description: PR number when triggered from a PR (label/comment), else ''.
    value: ${{ steps.context.outputs.pr_number }}
  mode:
    description: "One of: pull_request, label, comment, push, manual, schedule, '' (no run)."
    value: ${{ steps.context.outputs.mode }}
  same_repo:
    description: "'true' when the target ref belongs to this repository."
    value: ${{ steps.context.outputs.same_repo }}
  scope:
    description: >
      'diff' when the event carries an exact previous state to compare against
      (push with a valid before-SHA, automatic same-repo PRs), 'full'
      otherwise (label, comment, manual, schedule). Diff-scoped SAST is exact
      for "did this change introduce a finding" because Semgrep CE findings
      are per-file; pair it with a scheduled full scan to cover registry
      ruleset drift against unchanged code.
    value: ${{ steps.context.outputs.scope }}
  base_sha:
    description: Diff base for scope=diff, else ''.
    value: ${{ steps.context.outputs.base_sha }}
  deps_changed:
    description: >
      'false' only when dependency-paths was provided, the event is
      diff-scoped, and the diff verifiably touches none of the dependency
      paths. Any uncertainty (full scope, API failure, truncated file list)
      fails open to 'true'.
    value: ${{ steps.context.outputs.deps_changed }}
  semgrep_changed:
    description: >
      'false' only when an automatic PR diff is complete and contains no
      added, modified, or renamed file outside automatic-pr-ignored-paths.
      Uncertainty and explicit/full scans fail open to 'true'.
    value: ${{ steps.context.outputs.semgrep_changed }}

  source_changed:
    description: "Whether source rules are needed in addition to secret detection."
    value: ${{ steps.context.outputs.source_changed }}

runs:
  using: composite
  steps:
    - name: Resolve trigger context
      id: context
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { resolveIncrementalPrBase } = require(
            `${process.env.GITHUB_ACTION_PATH}/../resolve-incremental-pr-base/resolve.cjs`,
          );
          const { classifyChanges } = require(`${process.env.GITHUB_ACTION_PATH}/scope.cjs`);
          const eventName = context.eventName;
          const securityLabel = process.env.SECURITY_LABEL;
          const requireSameRepo = process.env.REQUIRE_SAME_REPO === "true";
          const automaticSameRepoPullRequests = process.env.AUTOMATIC_SAME_REPO_PULL_REQUESTS === "true";
          const repoFullName = `${context.repo.owner}/${context.repo.repo}`;

          let shouldRun = false;
          let ref = context.sha;
          let prNumber = "";
          let mode = "";
          let sameRepo = true;
          // 'full' unless the event carries an exact previous state to diff
          // against. Explicit human requests (label/comment/manual/schedule)
          // always get the full scan they asked for.
          let scope = "full";
          let baseSha = "";

          if (eventName === "pull_request") {
            const pr = context.payload.pull_request;
            ref = pr.head.sha;
            prNumber = String(pr.number);
            const labelName = context.payload.label?.name || "";
            const isSecurityLabel = labelName === securityLabel;
            const isBot = pr.user?.login === "dependabot[bot]";
            sameRepo = pr.head.repo.full_name === repoFullName;
            if (isSecurityLabel && !isBot) {
              shouldRun = true;
              mode = "label";
            } else if (
              automaticSameRepoPullRequests &&
              sameRepo &&
              !isBot &&
              ["opened", "reopened", "synchronize"].includes(context.payload.action)
            ) {
              shouldRun = true;
              mode = "pull_request";
              scope = "diff";
              // Reusing only a fresh, successful same-PR ancestor means this
              // run scans exactly the work not already proven. The resolver
              // falls back to pr.base.sha whenever that proof is uncertain.
              const incrementalBase = process.env.INCREMENTAL_EVIDENCE === "false"
                ? { baseSha: pr.base.sha, reused: false }
                : await resolveIncrementalPrBase({
                github,
                context,
                core,
                fallbackBaseSha: pr.base.sha,
                headSha: pr.head.sha,
                headRef: pr.head.ref,
                pullRequestNumber: pr.number,
                evidenceJobName: process.env.AUTOMATIC_PR_EVIDENCE_JOB_NAME,
                evidenceStepName: process.env.AUTOMATIC_PR_EVIDENCE_STEP_NAME,
                cancelledRunEvidenceJobPatterns:
                  process.env.AUTOMATIC_PR_CANCELLED_EVIDENCE_JOB_PATTERNS
                    .split("\n")
                    .map((line) => line.trim())
                    .filter(Boolean),
              });
              baseSha = incrementalBase.baseSha;
            }
            if (shouldRun && requireSameRepo && pr.head.repo.full_name !== repoFullName) {
              core.warning(`Skipping security scan for forked PR ${pr.number}; needs same-repo branch for build secrets.`);
              shouldRun = false;
              mode = "";
            }
          } else if (eventName === "issue_comment") {
            const body = (context.payload.comment.body || "").trim();
            const isCommand =
              /^\/gv-test\s+security\b/.test(body) ||
              /^@gv-ci\s+run\s+security\b/.test(body);
            const isPr = Boolean(context.payload.issue.pull_request);
            if (isCommand && isPr) {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              const allowed = ["admin", "maintain", "write"].includes(permission.permission);
              if (!allowed) {
                core.warning(`Ignoring security command from ${context.payload.comment.user.login}; permission=${permission.permission}`);
              } else {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number,
                });
                sameRepo = pr.head.repo.full_name === repoFullName;
                if (requireSameRepo && pr.head.repo.full_name !== repoFullName) {
                  core.warning(`Ignoring security command for forked PR ${pr.number}; build secrets only for same-repo branches.`);
                } else {
                  ref = pr.head.sha;
                  prNumber = String(context.payload.issue.number);
                  shouldRun = true;
                  mode = "comment";
                }
              }
            }
          } else if (eventName === "push") {
            shouldRun = true;
            mode = "push";
            const before = context.payload.before || "";
            // A branch-creation push has an all-zero before; nothing to diff
            // against, so stay full-scope.
            if (/^[0-9a-f]{40}$/.test(before) && !/^0{40}$/.test(before)) {
              scope = "diff";
              baseSha = before;
            }
          } else if (eventName === "workflow_dispatch") {
            shouldRun = true;
            mode = "manual";
          } else if (eventName === "schedule") {
            shouldRun = true;
            mode = "schedule";
          }

          // Inventory scans (Trivy over lockfile/OS environments) only change
          // their answer when a dependency input changes or the advisory DB
          // updates. The scheduled/manual/label paths cover DB drift with
          // scope=full above; here, for diff-scoped events, check whether the
          // diff touches any declared dependency path. Every uncertain branch
          // fails open to true — skipping is only allowed on positive proof.
          let decision = { depsChanged: true, semgrepChanged: true, sourceChanged: true };
          const lines = (value) => (value || "").split("\n").map((line) => line.trim()).filter(Boolean);
          if (shouldRun && scope === "diff") {
            try {
              let files;
              let complete = false;
              if (process.env.CHANGES_FILE) {
                const proof = JSON.parse(require('fs').readFileSync(process.env.CHANGES_FILE, 'utf8'));
                if (proof.complete !== true || proof.head !== ref || proof.base !== context.payload.pull_request?.base.sha) {
                  throw new Error('Precomputed PR evidence is incomplete or stale');
                }
                // A successful earlier scan may justify a smaller delta than
                // the full PR evidence. Resolve that delta only when necessary.
                if (proof.base === baseSha) {
                  files = proof.files;
                  complete = true;
                }
              }
              if (files === undefined) {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${baseSha}...${ref}`,
                });
                files = comparison.files;
                complete = Array.isArray(files) && files.length < 300;
              }
              // Missing, stale or capped evidence cannot justify skipping.
              // Enforcement point: a proven-equivalent lock is not a dependency change, and only
              // for the base the proof was made against.
              const unchanged = process.env.UNCHANGED_DEPENDENCY_BASE === baseSha
                ? new Set((process.env.UNCHANGED_DEPENDENCY_PATHS || "").split(/\s+/).filter(Boolean))
                : new Set();
              decision = classifyChanges({
                files,
                complete,
                dependencyPatterns: lines(process.env.DEPENDENCY_PATHS).filter((pattern) => !unchanged.has(pattern)),
                ignoredPaths: lines(process.env.AUTOMATIC_PR_IGNORED_PATHS),
                sourceExcludedPaths: lines(process.env.SOURCE_EXCLUDED_PATHS),
                prosePatterns: lines(process.env.PROSE_PATHS),
              });
            } catch (error) {
              core.warning(`Could not compare ${baseSha}...${ref} (${error.message}); retaining all security checks.`);
            }
          }

          if (shouldRun && process.env.INVENTORY_JOB_NAME) {
            const { resolveInventory } = require(`${process.env.GITHUB_ACTION_PATH}/inventory.cjs`);
            const inventory = await resolveInventory({
              github, shared: process.env.DEPENDENCY_TOKEN ? getOctokit(process.env.DEPENDENCY_TOKEN) : null,
              context, core, actionPath: process.env.GITHUB_ACTION_PATH,
              paths: lines(process.env.INVENTORY_INPUTS || process.env.DEPENDENCY_PATHS), jobName: process.env.INVENTORY_JOB_NAME, mode,
            });
            if (inventory) {
              decision.depsChanged = inventory.changed;
              core.setOutput('inventory-receipt', inventory.receipt);
            }
          }

          core.setOutput("should_run", shouldRun ? "true" : "false");
          core.setOutput("ref", ref);
          core.setOutput("pr_number", prNumber);
          core.setOutput("mode", mode);
          core.setOutput("same_repo", sameRepo ? "true" : "false");
          core.setOutput("scope", scope);
          core.setOutput("base_sha", baseSha);
          core.setOutput("source_changed", decision.sourceChanged ? "true" : "false");
          core.setOutput("deps_changed", decision.depsChanged ? "true" : "false");
          core.setOutput("semgrep_changed", decision.semgrepChanged ? "true" : "false");
      env:
        SOURCE_EXCLUDED_PATHS: ${{ inputs.source-excluded-paths }}
        INVENTORY_JOB_NAME: ${{ inputs.inventory-job-name }}
        INVENTORY_INPUTS: ${{ inputs.inventory-inputs }}
        DEPENDENCY_TOKEN: ${{ inputs.dependency-token }}
        SECURITY_LABEL: ${{ inputs.security-label }}
        REQUIRE_SAME_REPO: ${{ inputs.require-same-repo }}
        AUTOMATIC_SAME_REPO_PULL_REQUESTS: ${{ inputs.automatic-same-repo-pull-requests }}
        AUTOMATIC_PR_EVIDENCE_STEP_NAME: ${{ inputs.automatic-pr-evidence-step-name }}
        AUTOMATIC_PR_EVIDENCE_JOB_NAME: ${{ inputs.automatic-pr-evidence-job-name }}
        INCREMENTAL_EVIDENCE: ${{ inputs.incremental-evidence }}
        UNCHANGED_DEPENDENCY_PATHS: ${{ inputs.unchanged-dependency-paths }}
        UNCHANGED_DEPENDENCY_BASE: ${{ inputs.unchanged-dependency-base }}
        AUTOMATIC_PR_CANCELLED_EVIDENCE_JOB_PATTERNS: ${{ inputs.automatic-pr-cancelled-evidence-job-patterns }}
        AUTOMATIC_PR_IGNORED_PATHS: ${{ inputs.automatic-pr-ignored-paths }}
        CHANGES_FILE: ${{ inputs.changes-file }}
        DEPENDENCY_PATHS: ${{ inputs.dependency-paths }}
        PROSE_PATHS: ${{ inputs.prose-paths }}
