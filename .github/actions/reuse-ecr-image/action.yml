name: Reuse an exact ECR image
description: >
  Re-tag an existing image manifest inside one ECR repository without pulling
  or rebuilding layers. Every lookup or promotion problem returns reused=false
  so callers can continue through their normal image build path.

inputs:
  source-image:
    description: Full ECR image reference for the immutable, previously verified artifact.
    required: true
  target-image:
    description: Full ECR image reference that deployment will consume.
    required: true

outputs:
  reused:
    description: '"true" only when source and target resolve to the same digest.'
    value: ${{ steps.reuse.outputs.reused }}
  reason:
    description: Stable reason describing the reuse hit or fallback.
    value: ${{ steps.reuse.outputs.reason }}
  digest:
    description: Reused target digest; empty on fallback.
    value: ${{ steps.reuse.outputs.digest }}
  source-digest:
    description: Resolved source digest; empty when the source could not be resolved.
    value: ${{ steps.reuse.outputs.source-digest }}

runs:
  using: composite
  steps:
    - name: Reuse exact ECR manifest
      id: reuse
      shell: bash
      env:
        SOURCE_IMAGE_TAG: ${{ inputs.source-image }}
        TARGET_IMAGE_TAG: ${{ inputs.target-image }}
      run: "${{ github.action_path }}/reuse_ecr_image.sh"
