name: Restore a validated Python environment
description: Cache a complete uv environment with exact installation identity, repair broken restores, and always verify the lock.
inputs:
  uv-version:
    description: Exact uv version; match this to a production exporter or lockfile contract when required.
    default: '0.11.19'
  python-version:
    description: Python version to install; the cache uses the resolved patch and architecture.
    default: '3.14'
  working-directory:
    description: Project or workspace directory, relative to the checkout.
    default: '.'
  sync-args:
    description: Dependency group/extra/workspace flags for uv sync; locked verification is mandatory.
    default: ''
  cache-variant:
    description: Additional caller-owned identity for ABI, system dependencies or runner image changes.
    default: ''
  cache-salt:
    description: Optional isolated cache namespace for cold/warm experiments.
    default: ''
  cache-environment:
    description: Restore/save the expanded .venv. Disable when recreating from uv's download cache is faster; locked sync always runs.
    default: 'true'
  private-dependency-token:
    description: Optional GitHub read token scoped to the locked sync subprocess, never saved in Git configuration.
    default: ''
outputs:
  cache-hit:
    description: Exact cache entry found; locked synchronization still verifies it.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        prune-cache: true
    - id: identity
      shell: bash
      env:
        CACHE_SCRIPT: ${{ github.action_path }}/../../../scripts/ci/environment_cache.py
        CACHE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CACHE_SYNC_ARGS: ${{ inputs.sync-args }}
        CACHE_VARIANT: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.uv-version }}-${{ inputs.cache-variant }}
        CACHE_MANIFESTS: ${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/uv.toml', '**/.python-version') }}
      run: python "$CACHE_SCRIPT" identity
    - id: restore
      if: inputs.cache-environment == 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: ci-esta-venv-${{ inputs.cache-salt }}-${{ steps.identity.outputs.key }}
    - id: sync
      shell: bash
      env:
        CI_ESTA_GIT_TOKEN: ${{ inputs.private-dependency-token }}
        CACHE_SCRIPT: ${{ github.action_path }}/../../../scripts/ci/environment_cache.py
        CACHE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CACHE_SYNC_ARGS: ${{ inputs.sync-args }}
      run: python "$CACHE_SCRIPT" sync
    - name: Record validated cache outcome
      id: measurement
      continue-on-error: true
      shell: bash
      env:
        MEASUREMENT_SCRIPT: ${{ github.action_path }}/../../../scripts/ci/record_measurement.py
        MEASUREMENT_SCOPE: ${{ inputs.working-directory }}:${{ steps.identity.outputs.key }}
        CACHE_ENABLED: ${{ inputs.cache-environment }}
        CACHE_RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_USABLE: ${{ steps.sync.outputs.restored-usable }}
        CACHE_SYNC_SECONDS: ${{ steps.sync.outputs.sync-seconds }}
      run: python "$MEASUREMENT_SCRIPT" cache
    - name: Publish cache measurement
      if: steps.measurement.outputs.measurement-path != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.measurement.outputs.measurement-name }}
        path: ${{ steps.measurement.outputs.measurement-path }}
        retention-days: 7
    - if: ${{ success() && inputs.cache-environment == 'true' && steps.restore.outputs.cache-hit != 'true' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: ci-esta-venv-${{ inputs.cache-salt }}-${{ steps.identity.outputs.key }}
