name: Set up backend-common Python
description: Install the repository's supported Python, uv, cache, and development dependencies.

inputs:
  python-version:
    description: Python minor used by backend-common CI.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install development dependencies
      shell: bash
      # --locked fails the build when uv.lock drifts from pyproject.toml, so a
      # dependency edit cannot land without a refreshed lock file.
      run: uv sync --locked --all-groups
