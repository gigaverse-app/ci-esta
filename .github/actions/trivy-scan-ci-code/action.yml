name: Scan CI code with Trivy
description: Stage configured CI-code paths and scan them for misconfigurations and secrets with the shared Trivy version.

inputs:
  ci-files:
    description: Newline-delimited changed repository-relative CI-code files.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Stage CI code paths
      id: stage
      shell: bash
      env:
        CI_FILES: ${{ inputs.ci-files }}
      run: |
        set -euo pipefail
        CI_FILES="${CI_FILES:-}"

        scan_root="$RUNNER_TEMP/shared-ci-code-scan"
        mkdir -p "$scan_root"
        target_count=0
        while IFS= read -r ci_file; do
          [ -n "$ci_file" ] || continue
          [ -f "$ci_file" ] || { echo "CI file does not exist: $ci_file" >&2; exit 2; }
          tar -cf - -- "$ci_file" | tar -xf - -C "$scan_root"
          target_count=$((target_count + 1))
        done <<EOF
        $CI_FILES
        EOF
        [ "$target_count" -gt 0 ] || { echo "At least one CI file is required" >&2; exit 2; }
        echo "scan-root=$scan_root" >> "$GITHUB_OUTPUT"

    - name: Run Trivy CI-code scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ steps.stage.outputs.scan-root }}
        version: "v0.72.0"
        scanners: misconfig,secret
        format: table
        exit-code: "1"
        severity: CRITICAL,HIGH
