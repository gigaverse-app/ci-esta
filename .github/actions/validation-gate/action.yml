name: Validate complete merge prerequisites
description: Fail closed on missing, failed, cancelled or unexpectedly skipped prerequisites.
inputs:
  needs:
    description: JSON serialization of the aggregate job's direct needs.
    required: true
  required:
    description: JSON boolean map with one admission decision per direct prerequisite.
    default: ''
  planner:
    description: Direct prerequisite that produced the lane plan, when using lane-jobs.
    default: select-tests
  lanes:
    description: Planner's JSON lane booleans; absent values require execution.
    default: '{}'
  lane-jobs:
    description: JSON map from each conditional job to its affecting lanes; all unmapped jobs are required.
    default: '{}'
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        VALIDATION_NEEDS: ${{ inputs.needs }}
        VALIDATION_REQUIRED: ${{ inputs.required }}
        VALIDATION_PLANNER: ${{ inputs.planner }}
        VALIDATION_LANES: ${{ inputs.lanes }}
        VALIDATION_LANE_JOBS: ${{ inputs.lane-jobs }}
      with:
        script: |
          const { validateGate, selectedRequirements } = require(`${process.env.GITHUB_ACTION_PATH}/gate.cjs`);
          const needs = JSON.parse(process.env.VALIDATION_NEEDS);
          const required = process.env.VALIDATION_REQUIRED.trim()
            ? JSON.parse(process.env.VALIDATION_REQUIRED)
            : selectedRequirements(needs, process.env.VALIDATION_PLANNER,
                JSON.parse(process.env.VALIDATION_LANES), JSON.parse(process.env.VALIDATION_LANE_JOBS));
          validateGate(needs, required);
