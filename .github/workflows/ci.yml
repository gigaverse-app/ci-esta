name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  plan:
    name: Evidence plan
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.evidence.outputs.receipt }}
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/collect-pr-changes
      - uses: ./.github/actions/resolve-lane-evidence
        id: evidence
        with:
          lanes: '{"tests":"Test suite","compat":"Python compatibility"}'
          # Complete test/build inputs; docs and the disposable live probe do not affect these jobs.
          input-paths: '[".github","src","tests","scripts","pyproject.toml","uv.lock","README.md","LICENSE","conftest.py","pytest.ini","tox.ini","setup.cfg",".ruff.toml","ruff.toml",".python-version",".gitattributes"]'
      - name: Record admission
        env:
          REUSED: ${{ steps.evidence.outputs.reused }}
        run: echo "$REUSED"

  tests:
    name: Test suite
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || !fromJSON(needs.plan.outputs.reused || '{}').tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
      - name: Install the Python 3.14 source-parser runtime
        run: |
          uv python install 3.14
          echo "$(dirname "$(uv python find 3.14)")" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q -n 4
      - run: uv build
      - name: Verify installed wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-test" --python 3.11
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/ci-esta" --help
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  compat:
    name: Python compatibility
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || !fromJSON(needs.plan.outputs.reused || '{}').compat) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
      - name: Install the Python 3.14 source-parser runtime
        run: |
          uv python install 3.14
          echo "$(dirname "$(uv python find 3.14)")" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run pytest -q -n 4
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  gate:
    name: Validation gate
    needs: [plan, tests, compat]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/validation-gate
        with:
          needs: ${{ toJSON(needs) }}
          required: >-
            {"plan":true,"tests":${{ !fromJSON(needs.plan.outputs.reused || '{}').tests }},"compat":${{ !fromJSON(needs.plan.outputs.reused || '{}').compat }}}

  report:
    name: CI report
    needs: gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/ci-observability
        with:
          github-token: ${{ github.token }}
          required-gates-json: '[{"kind":"actions_job","job_name":"Validation gate"}]'
          post-sticky: 'false'
          test-selection-artifact: ''
          full-suite-reference-artifact: ''
      # Reporting is fail-open for users. Our own CI must catch a broken reporter.
      - name: Verify the real API report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ci-observability.json').read_text())
          assert report['collection_status'] == 'complete', report
          assert Path('ci-observability.md').stat().st_size > 0
          assert Path('ci-observability.prom').stat().st_size > 0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-esta-report
          path: |
            ci-observability.json
            ci-observability.md
            ci-observability.prom
