name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      timing-example:
        description: Optional retained timing example; run alpha and beta independently, then verify.
        type: choice
        options: ['off', alpha, beta, verify]
        default: 'off'
      timing-history-key:
        description: Isolated history scope for the example; use the same key for all three runs.
        default: manual-timing-example
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  timing-example:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.timing-example || 'off') != 'off' }}
    uses: ./.github/workflows/timing-history-example.yml
    with:
      mode: ${{ inputs.timing-example }}
      history-key: ${{ inputs.timing-history-key }}
  plan:
    name: Evidence plan
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.evidence.outputs.receipt }}
      reused: ${{ steps.evidence.outputs.reused }}
      lanes: ${{ steps.selection.outputs.lanes }}
      release-only: ${{ steps.evidence.outputs.release-only }}
      mode: ${{ steps.files.outputs.mode || 'none' }}
      files: ${{ steps.files.outputs.test_roots_json || '[]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./actions/current-pr-head
        if: ${{ github.event_name == 'pull_request' }}
        with:
          pr-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
      - uses: ./actions/collect-pr-changes
      # The lane graph includes Bun tests, so planning needs their runtime too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: examples/bun-cache/.bun-version
      - uses: ./actions/plan-work
        id: selection
        with:
          config: .github/test-lanes.json
      - name: Derive file selection from the shared lane inputs
        if: ${{ fromJSON(steps.selection.outputs.lanes).tests }}
        run: >-
          bash scripts/ci/tool-runtime.sh pytest_selective.impact_cli
          file-config --lanes .github/test-lanes.json --output "$RUNNER_TEMP/test-impact.json"
      - uses: ./actions/test-impact
        id: files
        if: ${{ fromJSON(steps.selection.outputs.lanes).tests }}
        with:
          config: ${{ runner.temp }}/test-impact.json
          full-roots: tests
      - name: "PR evidence #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'
        run: 'true'
      - id: validation-inputs
        run: |
          paths=$(jq -c . .github/validation-inputs.json)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      - uses: ./actions/resolve-lane-evidence
        id: evidence
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(github.event.pull_request.labels.*.name, 'test:full') }}
        with:
          lanes: '{"tests":"Test suite","compat":"Python compatibility","contracts":"Runtime contracts"}'
          execution-context: ${{ steps.files.outputs.mode }} ${{ steps.files.outputs.test_roots_json }}
          reuse-after-merge: 'true'
          reuse-version-only-release: 'true'
          input-paths: ${{ steps.validation-inputs.outputs.paths }}
      - name: Record admission
        env:
          REUSED: ${{ steps.evidence.outputs.reused }}
        run: echo "$REUSED"

  tests:
    name: Test suite
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').tests)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.11'
      - name: Install the Python 3.14 source-parser runtime
        run: |
          uv python install 3.14
          echo "$(dirname "$(uv python find 3.14)")" >> "$GITHUB_PATH"
      - run: uv run --locked pytest-selective execute-plan -- -q -n 4 --dist=worksteal --junitxml=junit.xml
        env:
          CI_PLANNER_RESULT: ${{ needs.plan.result }}
          CI_TEST_MODE: ${{ needs.plan.outputs.mode }}
          CI_TEST_FILES: ${{ needs.plan.outputs.files }}
      - uses: ./actions/learn-test-timings
        if: ${{ hashFiles('junit.xml') != '' }}
        with:
          junit-pattern: junit.xml
          artifact-name: test-timings-py311
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  compat:
    name: Python compatibility
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').compat)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.14'
      - name: Install the Python 3.14 source-parser runtime
        run: |
          uv python install 3.14
          echo "$(dirname "$(uv python find 3.14)")" >> "$GITHUB_PATH"
      - run: uv run --locked pytest-selective execute-plan -- -q -n 4 --dist=worksteal --junitxml=junit.xml
        env:
          CI_PLANNER_RESULT: ${{ needs.plan.result }}
          CI_TEST_MODE: ${{ needs.plan.outputs.mode }}
          CI_TEST_FILES: ${{ needs.plan.outputs.files }}
      - uses: ./actions/learn-test-timings
        if: ${{ hashFiles('junit.xml') != '' }}
        with:
          junit-pattern: junit.xml
          artifact-name: test-timings-py314
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  gate:
    name: Validation gate
    needs: [plan, tests, compat, contracts, quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/validation-gate
        with:
          needs: ${{ toJSON(needs) }}
          required: >-
            {"plan":true,"quality":true,"tests":${{ needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').tests) }},"compat":${{ needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').compat) }},"contracts":${{ needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').contracts) }}}

  contracts:
    name: Runtime contracts
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').contracts)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Exercise native Bun selection and fallback controls
        run: node --test tests/github_actions/*.test.*
      - name: Exercise selected routing and gate contracts
        run: uv run pytest -q tests/ci/test_repository_routing.py tests/ci/test_validation_gate.py tests/testing/test_workflow_adoption.py tests/testing/test_bun_python_api.py tests/testing/test_bun_lanes.py
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  quality:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.14'
      - run: uv run ruff check .
      - run: uv run lint-imports --config importlinter.toml --no-cache
      # Packaging work is selected like tests: docs-only changes build nothing.
      - name: Build distributions
        if: ${{ needs.plan.outputs.release-only == 'true' || needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).package }}
        run: uv build
      - name: Check distribution metadata
        if: ${{ needs.plan.outputs.release-only == 'true' || needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).package }}
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Verify installed wheel
        if: ${{ needs.plan.outputs.release-only == 'true' || needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).package }}
        run: |
          uv venv "$RUNNER_TEMP/wheel-test" --python 3.11
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/ci-esta" --help
          "$RUNNER_TEMP/wheel-test/bin/python" -c "import importlib.util; assert importlib.util.find_spec('pytest_selective') is None; assert importlib.util.find_spec('pytest') is None"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" "$(find '${{ github.workspace }}/dist' -name '*.whl' -print -quit)[pytest]"
          CI_TEST_RESOURCE_OBSERVABILITY=true "$RUNNER_TEMP/wheel-test/bin/ci-esta-resources" \
            "$RUNNER_TEMP/wheel-test/bin/ci-esta-pytest" pools --shards 13 --shards-per-runner 12
      - name: Verify source distribution
        if: ${{ needs.plan.outputs.release-only == 'true' || needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).package }}
        run: |
          uv venv "$RUNNER_TEMP/sdist-test" --python 3.14
          uv pip install --python "$RUNNER_TEMP/sdist-test/bin/python" "$(find dist -name '*.tar.gz' -print -quit)[pytest]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-test/bin/ci-esta" --help
          "$RUNNER_TEMP/sdist-test/bin/ci-esta-pytest" pools --shards 5 --shards-per-runner 2
      - uses: actions/upload-artifact@v7
        if: ${{ needs.plan.outputs.release-only == 'true' || needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).package }}
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
