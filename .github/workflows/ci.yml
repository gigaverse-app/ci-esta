name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  plan:
    name: Evidence plan
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.evidence.outputs.receipt }}
      reused: ${{ steps.evidence.outputs.reused }}
      lanes: ${{ steps.selection.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/current-pr-head
        if: ${{ github.event_name == 'pull_request' }}
        with:
          pr-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/collect-pr-changes
      - uses: gigaverse-app/pytest-selective/.github/actions/plan-lanes@v0.1
        id: selection
        with:
          config: .github/test-lanes.json
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          full: ${{ github.run_attempt > 1 || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:full') }}
      - uses: ./.github/actions/resolve-lane-evidence
        id: evidence
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'test:full') }}
        with:
          lanes: '{"tests":"Test suite","compat":"Python compatibility"}'
          # Complete test/build inputs; docs and the disposable live probe do not affect these jobs.
          input-paths: '["actions","action.yml","cancel-obsolete-pr-runs","ci-observability","ci-observability-enrichment","collect-ci-changes","collect-pr-changes","collect-pytest-changes","coverage-policy","current-pr-head","learn-test-timings","lint-ci-code","native-windows-git","plan-pytest-shards","plan-runner-pools","postgres-client","publish-prometheus-snapshot","pytest-canary-pr-state","pytest-expansion","pytest-failure-canary","pytest-timings","resolve-incremental-pr-base","resolve-lane-evidence","resolve-pytest-evidence","resolve-security-trigger","reuse-ecr-image","run-bun-tests","semgrep-scan","semgrep-scan-ci-code","setup-cached-uv","setup-python-uv","test-impact","trivy-scan-ci-code","trivy-scan-image","typecheck-scope","validation-gate","verify-pytest-completion","report-bun-tests","examples",".github","src","tests","scripts","pyproject.toml","uv.lock","importlinter.toml","README.md","LICENSE","conftest.py","pytest.ini","tox.ini","setup.cfg",".ruff.toml","ruff.toml",".python-version",".gitattributes"]'
      - name: Record admission
        env:
          REUSED: ${{ steps.evidence.outputs.reused }}
        run: echo "$REUSED"

  tests:
    name: Test suite
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').tests)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.11'
      - name: Install the Python 3.14 source-parser runtime
        run: |
          uv python install 3.14
          echo "$(dirname "$(uv python find 3.14)")" >> "$GITHUB_PATH"
      - run: uv run pytest -q -n 4 --junitxml=junit.xml
      - uses: ./.github/actions/learn-test-timings
        with:
          junit-pattern: junit.xml
          artifact-name: test-timings-py311
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  compat:
    name: Python compatibility
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').compat)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.14'
      - name: Install the Python 3.14 source-parser runtime
        run: |
          uv python install 3.14
          echo "$(dirname "$(uv python find 3.14)")" >> "$GITHUB_PATH"
      - run: uv run pytest -q -n 4 --junitxml=junit.xml
      - uses: ./.github/actions/learn-test-timings
        with:
          junit-pattern: junit.xml
          artifact-name: test-timings-py314
      - name: ${{ needs.plan.outputs.receipt || 'Uncached validation completed' }}
        run: 'true'

  gate:
    name: Validation gate
    needs: [plan, tests, compat, quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/validation-gate
        with:
          needs: ${{ toJSON(needs) }}
          required: >-
            {"plan":true,"quality":true,"tests":${{ needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').tests) }},"compat":${{ needs.plan.result != 'success' || (toJSON(fromJSON(needs.plan.outputs.lanes || '{}').tests) != 'false' && !fromJSON(needs.plan.outputs.reused || '{}').compat) }}}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.14'
      - run: uv run ruff check .
      - run: uv run python scripts/public_actions.py --check
      - run: uv run lint-imports --config importlinter.toml --no-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Exercise native Bun selection and fallback controls
        run: node --test tests/github_actions/bun-selection.test.mjs tests/github_actions/bun-work-report.test.mjs
      - name: Always exercise routing and gate contracts
        run: uv run pytest -q tests/ci/test_repository_routing.py tests/ci/test_validation_gate.py tests/testing/test_workflow_adoption.py
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Verify installed wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-test" --python 3.11
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/ci-esta" --help
          "$RUNNER_TEMP/wheel-test/bin/python" -c "import importlib.util; assert importlib.util.find_spec('pytest_selective') is None; assert importlib.util.find_spec('pytest') is None"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" "$(find '${{ github.workspace }}/dist' -name '*.whl' -print -quit)[pytest]"
          CI_TEST_RESOURCE_OBSERVABILITY=true "$RUNNER_TEMP/wheel-test/bin/ci-esta-resources" \
            "$RUNNER_TEMP/wheel-test/bin/ci-esta-pytest" pools --shards 13 --shards-per-runner 12
      - name: Verify source distribution
        run: |
          uv venv "$RUNNER_TEMP/sdist-test" --python 3.14
          uv pip install --python "$RUNNER_TEMP/sdist-test/bin/python" "$(find dist -name '*.tar.gz' -print -quit)[pytest]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-test/bin/ci-esta" --help
          "$RUNNER_TEMP/sdist-test/bin/ci-esta-pytest" pools --shards 5 --shards-per-runner 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
