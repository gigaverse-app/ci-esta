name: Evidence lifecycle model
on:
  pull_request:
    paths:
      - 'specs/**'
      - '.github/workflows/models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v5
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-0.33.1-apalache-0.62.4
      - name: Check safety, recovery and expected counterexamples
        run: python specs/check.py
