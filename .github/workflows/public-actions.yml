name: Public action smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
          artifact-name: public-action-selection
  public-actions:
    needs: select-tests
    if: >-
      ${{ !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the public selector graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('.github/test-lanes.json').read_text())['graph']
          Path('public-impact.json').write_text(json.dumps(graph))
          PY
      - uses: ./actions/test-impact
        id: impact
        with:
          config: public-impact.json
          base: ${{ github.sha }}
          full: 'true'
          full-roots: tests
          explanation-artifact: ''
      - name: Verify forwarded JSON paths
        env:
          ROOTS: ${{ steps.impact.outputs.test_roots_json }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: |
          python - <<'PY'
          import json, os
          assert json.loads(os.environ['ROOTS']) == ['tests']
          assert 'proof unavailable' not in os.environ['REASON'].lower()
          PY
      # Exercise isolated planning before an application environment can mask
      # missing action dependencies (the 1.3.0 filelock regression).
      - uses: ./actions/plan-runner-pools
        id: pools
        with:
          shards: '5'
          shards-per-runner: '4'
      - uses: ./actions/plan-pytest-shards
        with:
          working-directory: .
          test-root: examples/timing-history/tests
          shards: '3'
          durations: .public-action-durations
          output-dir: .public-action-shards
      - name: Verify action outputs
        env:
          POOLS: ${{ steps.pools.outputs.pools }}
          COUNT: ${{ steps.pools.outputs.count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pools = json.loads(os.environ['POOLS'])
          assert os.environ['COUNT'] == '2'
          assert [(p['first_shard'], p['last_shard']) for p in pools] == [(1, 4), (5, 5)]
          files = [line for path in Path('.public-action-shards').glob('*.txt') for line in path.read_text().splitlines()]
          assert sorted(files) == ['examples/timing-history/tests/test_alpha.py', 'examples/timing-history/tests/test_beta.py'], files
          PY
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.12'
      - name: Run real pytest files through the shard runner
        run: |
          mkdir -p splits
          printf '%s\n' tests/testing/test_runner_pools.py > splits/group-1.txt
          printf '%s\n' tests/testing/test_coverage.py > splits/group-2.txt
          uv run ci-esta-pytest run-local --shards 2 --log-dir shard-logs -- python examples/pytest-shards/run_shard.py -q
      - uses: ./actions/publish-shard-measurements
        if: always()
        with:
          path: shard-logs/ci-esta-shards.json
          pool: public-smoke
      - name: Select a completed source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=1" > source-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))['workflow_runs'][0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"id={run['id']}\nattempt={run['run_attempt']}\nsha={run['head_sha']}\n")
          PY
      - uses: ./actions/ci-observability
        id: report
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.id }}
          run-attempt: ${{ steps.source.outputs.attempt }}
          commit-sha: ${{ steps.source.outputs.sha }}
          required-gates-json: '[{"kind":"actions_job","job_name":"Validation gate"}]'
          post-sticky: 'false'
          test-selection-artifact: ''
          lane-selection-artifact: ''
          full-suite-reference-artifact: ''
      - name: Verify the public reporter produced data
        env:
          REPORT: ${{ steps.report.outputs.report-file }}
        run: |
          test -s "$REPORT"
          python - <<'PY'
          import json, os
          report = json.load(open(os.environ['REPORT']))
          assert report['collection_status'] == 'complete', report.get('collection_errors')
          PY
      - name: Require successful planning after fallback execution
        if: ${{ !cancelled() && needs.select-tests.result != 'success' }}
        run: exit 1
