name: Public action smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
          artifact-name: public-action-selection
  bun-cache:
    needs: select-tests
    if: >-
      ${{ !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cold Bun dependency setup
        id: cold
        uses: ./actions/setup-cached-bun
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/ci-esta-bun-smoke
        with:
          working-directory: examples/bun-cache
          bun-version-file: examples/bun-cache/.bun-version
          cache-salt: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          measurement-name: Bun cold
      - name: Remove local dependency state before warm restore
        env:
          CACHE_PATH: ${{ runner.temp }}/ci-esta-bun-smoke
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          cache = Path(os.environ['CACHE_PATH']).resolve()
          assert cache.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve())
          shutil.rmtree(cache)
          shutil.rmtree('examples/bun-cache/node_modules')
          PY
      - name: Warm Bun dependency setup
        id: warm
        uses: ./actions/setup-cached-bun
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/ci-esta-bun-smoke
        with:
          working-directory: examples/bun-cache
          bun-version-file: examples/bun-cache/.bun-version
          cache-salt: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          measurement-name: Bun warm
      - name: Change lockfile formatting to exercise fallback restoration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('examples/bun-cache/bun.lock')
          lock.write_text(lock.read_text() + '\n')
          PY
      - name: Fallback Bun dependency setup
        id: fallback
        uses: ./actions/setup-cached-bun
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/ci-esta-bun-smoke
        with:
          working-directory: examples/bun-cache
          bun-version-file: examples/bun-cache/.bun-version
          cache-salt: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          measurement-name: Bun fallback
      - name: Bun setup without a download cache
        id: disabled
        uses: ./actions/setup-cached-bun
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/ci-esta-bun-disabled
        with:
          working-directory: examples/bun-cache
          bun-version-file: examples/bun-cache/.bun-version
          cache-downloads: 'false'
          measurement-name: Bun disabled
      - name: Verify cold, warm, fallback and disabled measurements
        env:
          COLD: ${{ steps.cold.outputs.measurement-path }}
          WARM: ${{ steps.warm.outputs.measurement-path }}
          FALLBACK: ${{ steps.fallback.outputs.measurement-path }}
          DISABLED: ${{ steps.disabled.outputs.measurement-path }}
        run: |
          python3 - <<'PY'
          import json, os
          cold = json.load(open(os.environ['COLD']))
          warm = json.load(open(os.environ['WARM']))
          fallback = json.load(open(os.environ['FALLBACK']))
          assert cold['outcome'] == 'miss', cold
          assert warm['outcome'] == 'exact-hit', warm
          assert fallback['outcome'] == 'fallback-hit', fallback
          for record in (cold, warm, fallback):
              assert record['sync_outcome'] == 'success', record
              assert record['sync_seconds'] >= 0, record
              assert record['restore_seconds'] >= 0, record
          assert cold['save_seconds'] >= 0, cold
          assert warm['save_seconds'] is None, warm
          disabled = json.load(open(os.environ['DISABLED']))
          assert disabled['outcome'] == 'skipped', disabled
          assert disabled['restore_seconds'] is None, disabled
          assert disabled['save_seconds'] is None, disabled
          assert disabled['sync_outcome'] == 'success', disabled
          assert disabled['sync_seconds'] >= 0, disabled
          PY
      - name: Require successful planning after fallback execution
        if: ${{ !cancelled() && needs.select-tests.result != 'success' }}
        run: exit 1
  reporting-runtime:
    needs: select-tests
    if: >-
      ${{ !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Verify cold setup, warm reuse and consumer isolation
        run: uv run --locked pytest -q tests/github_actions/test_reporting_runtime.py
  cold-typecheck-scope:
    needs: select-tests
    if: >-
      ${{ !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare isolated checker configuration without installing tools
        run: |
          command -v uv || echo 'Cold runner: uv is absent before the action'
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('.github/test-lanes.json').read_text())['graph']
          Path('cold-impact.json').write_text(json.dumps(graph))
          Path('cold-pyright.json').write_text(json.dumps({'include': ['src']}))
          PY
      - uses: ./actions/typecheck-scope
        id: scope
        with:
          config: cold-impact.json
          checker-config: cold-pyright.json
          # Compare a known passing base to itself. This smoke exercises action
          # setup; real consumers still require their type checker's own result.
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          clean-base-checks: Validation gate
          global-inputs: pyproject.toml uv.lock
      - name: Require real scope computation on the cold runner
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "$REASON"
          test "$MODE" = none
  public-actions:
    needs: select-tests
    if: >-
      ${{ !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/check-test-policy
        with:
          policy: examples/test-policy/policy.json
          cases: examples/test-policy/cases.json
      - uses: ./actions/plan-test-policy
        id: policy-smoke
        with:
          policy: examples/test-policy/policy.json
          profile: pr
          occasion: pr
          affected: '["unit","provider-eval"]'
      - name: Verify public policy action routing
        env:
          ADMITTED: ${{ steps.policy-smoke.outputs.admitted }}
        run: |
          python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['ADMITTED']) == {
              'unit': True, 'conformance': False, 'provider-eval': False, 'publish-smoke': False}
          PY
      - uses: ./actions/plan-test-policy
        id: defaults-smoke
        with:
          work: '["unit", {"id":"benchmark", "tags":["expensive"]}]'
          occasion: pull_request
          affected: '["unit", "benchmark"]'
      - name: Verify opinionated defaults without a policy file
        env:
          ADMITTED: ${{ steps.defaults-smoke.outputs.admitted }}
        run: |
          python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['ADMITTED']) == {'unit': True, 'benchmark': False}
          PY
      - name: Create native selector report for scope smoke
        run: >-
          echo '{"lanes":{"api":true,"browser":false},"reason":"affected source"}' > scope-smoke.json
      - uses: ./actions/resolve-lane-evidence
        id: scope-smoke
        with:
          lanes: '{"linux":"Linux tests","mac":"Mac tests"}'
          selection-keys: '["api","browser"]'
          selection: '{"api":true,"browser":false}'
          selection-report: scope-smoke.json
          allow-reuse: 'false'
      - name: Verify scope and fresh execution without evidence calls
        env:
          SELECTED: ${{ steps.scope-smoke.outputs.selection }}
          MATRIX: ${{ steps.scope-smoke.outputs.matrix }}
          RECEIPT: ${{ steps.scope-smoke.outputs.receipt }}
        run: |
          python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['SELECTED']) == {'api': True, 'browser': False}
          assert json.loads(os.environ['MATRIX']) == ['linux', 'mac']
          assert os.environ['RECEIPT'] == ''
          PY
      - name: Start a single-request local revision endpoint
        run: |
          node -e 'const s=require("node:http").createServer((req,res)=>{res.end(JSON.stringify({sha:"a".repeat(40)}));s.close();});s.listen(18766,"127.0.0.1");setTimeout(()=>s.close(),20000).unref();' &
      - uses: ./actions/observe-deployment
        id: deployment-smoke
        with:
          url: http://127.0.0.1:18766
          expected-sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          timeout-seconds: '10'
          poll-seconds: '0.1'
      - name: Verify local deployment identity
        env:
          STATE: ${{ steps.deployment-smoke.outputs.state }}
          SHA: ${{ steps.deployment-smoke.outputs.sha }}
        run: |
          test "$STATE" = ready
          test "$SHA" = aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Record budget start
        run: echo "POLICY_BUDGET_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./actions/test-budget
        id: budget-smoke
        with:
          total-seconds: '600'
          started-at: ${{ env.POLICY_BUDGET_START }}
          reserve-seconds: '60'
          requested-seconds: '30'
      - name: Require a positive bounded execution budget
        env:
          POLICY_SECONDS: ${{ steps.budget-smoke.outputs.seconds }}
        run: test "$POLICY_SECONDS" -gt 0 && test "$POLICY_SECONDS" -le 30
      - uses: ./actions/service-container
        with:
          phase: warm
          name: ci-esta-redis-smoke
          image: redis:7-alpine
      - name: Prepare the public selector graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('.github/test-lanes.json').read_text())['graph']
          Path('public-impact.json').write_text(json.dumps(graph))
          PY
      - uses: ./actions/test-impact
        id: impact
        with:
          config: public-impact.json
          base: ${{ github.sha }}
          full: 'true'
          full-roots: tests
          explanation-artifact: ''
      - name: Verify forwarded JSON paths
        env:
          ROOTS: ${{ steps.impact.outputs.test_roots_json }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: |
          python - <<'PY'
          import json, os
          assert json.loads(os.environ['ROOTS']) == ['tests']
          assert 'proof unavailable' not in os.environ['REASON'].lower()
          PY
      - name: Require prefetched Redis to be healthy
        uses: ./actions/service-container
        with:
          name: ci-esta-redis-smoke
          image: redis:7-alpine
          health-command: redis-cli ping
      - name: Exercise the real service
        run: test "$(docker exec ci-esta-redis-smoke redis-cli ping)" = PONG
      - uses: ./actions/service-container
        if: always()
        with:
          phase: stop
          name: ci-esta-redis-smoke
      - name: Restore timing history without installing the application
        uses: ./actions/restore-test-timings
        with:
          history-key: public-action-smoke-isolated
          output: .public-action-durations
          strict: 'true'
      # Exercise isolated planning before an application environment can mask
      # missing action dependencies (the 1.3.0 filelock regression).
      - uses: ./actions/plan-runner-pools
        id: pools
        with:
          shards: '5'
          shards-per-runner: '4'
      - uses: ./actions/plan-pytest-shards
        with:
          working-directory: .
          test-root: examples/timing-history/tests
          shards: '3'
          durations: .public-action-durations
          output-dir: .public-action-shards
      - name: Verify action outputs
        env:
          POOLS: ${{ steps.pools.outputs.pools }}
          COUNT: ${{ steps.pools.outputs.count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pools = json.loads(os.environ['POOLS'])
          assert os.environ['COUNT'] == '2'
          assert [(p['first_shard'], p['last_shard']) for p in pools] == [(1, 4), (5, 5)]
          files = [line for path in Path('.public-action-shards').glob('*.txt') for line in path.read_text().splitlines()]
          assert sorted(files) == ['examples/timing-history/tests/test_alpha.py', 'examples/timing-history/tests/test_beta.py'], files
          PY
      - uses: ./actions/setup-cached-uv
        with:
          python-version: '3.12'
      - name: Run real pytest files through the shard runner
        run: |
          mkdir -p splits
          printf '%s\n' tests/testing/test_runner_pools.py > splits/group-1.txt
          printf '%s\n' tests/testing/test_coverage.py > splits/group-2.txt
          uv run ci-esta-pytest run-local --shards 2 --log-dir shard-logs -- python examples/pytest-shards/run_shard.py -q
      - uses: ./actions/publish-shard-measurements
        if: always()
        with:
          path: shard-logs/ci-esta-shards.json
          pool: public-smoke
      - name: Select a completed source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=1" > source-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))['workflow_runs'][0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"id={run['id']}\nattempt={run['run_attempt']}\nsha={run['head_sha']}\n")
          PY
      - uses: ./actions/ci-observability
        id: report
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.id }}
          run-attempt: ${{ steps.source.outputs.attempt }}
          commit-sha: ${{ steps.source.outputs.sha }}
          required-gates-json: '[{"kind":"actions_job","job_name":"Validation gate"}]'
          post-sticky: 'false'
          test-selection-artifact: ''
          lane-selection-artifact: ''
          full-suite-reference-artifact: ''
      - name: Verify the public reporter produced data
        env:
          REPORT: ${{ steps.report.outputs.report-file }}
        run: |
          test -s "$REPORT"
          python - <<'PY'
          import json, os
          report = json.load(open(os.environ['REPORT']))
          assert report['collection_status'] == 'complete', report.get('collection_errors')
          PY
      - name: Require successful planning after fallback execution
        if: ${{ !cancelled() && needs.select-tests.result != 'success' }}
        run: exit 1
