name: Reusable CI report

on:
  workflow_call:
    inputs:
      run-id:
        description: Completed workflow run in the caller repository.
        type: number
        required: true
      run-attempt:
        type: number
        default: 1
      head-sha:
        description: Source run commit, not the reporting workflow commit.
        type: string
        required: true
      analyze-critical-path:
        description: Analyze the source workflow dependency graph without executing its code.
        type: boolean
        default: false
      job-dependencies-json:
        description: Complete job-name pattern to prerequisite-pattern map for critical-path analysis.
        type: string
        default: '{}'
      required-gates-json:
        description: Explicit gate selectors; empty leaves gate latency unassessed.
        type: string
        default: '[]'
      pull-request-number:
        type: string
        default: ''
      post-sticky:
        description: >
          Upsert the branded report as a pull-request comment. The caller must
          grant pull-requests write; read-only callers keep the job summary.
        type: boolean
        default: false
      work-selection-artifact:
        description: Optional provider-neutral ci-esta/work-selection/v1 artifact.
        type: string
        default: ''
      impact-comparisons-json:
        description: Historical benchmark pairs, verified against exact GitHub run attempts.
        type: string
        default: '[]'
      sticky-key:
        description: Stable comment identity. Different keys deliberately create separate comments.
        type: string
        default: ''
      sticky-workflow:
        description: Only this observed workflow publishes; others keep summaries and artifacts.
        type: string
        default: ''
      lane-selection-artifact:
        description: The observed run's pytest-selective lane plan artifact; empty disables the lane section.
        type: string
        default: test-lane-selection
      test-selection-artifact:
        description: Optional pytest-selective file explanation artifact; requires post-sticky true in the current reporter.
        type: string
        default: ''
      full-suite-reference-artifact:
        description: Optional full-suite timing reference artifact used with file selection.
        type: string
        default: ''

# No permissions block: the caller's grant is the ceiling, and a callee that asked for
# pull-requests write would fail every read-only caller at startup.

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-esta-publish-${{ github.repository }}-${{ inputs.post-sticky && inputs.pull-request-number || github.run_id }}
      cancel-in-progress: false
    steps:
      # The reporter at this reusable workflow's own commit, so one pin covers both. Never check
      # out or execute source-run code, including fork pull requests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gigaverse-app/ci-esta
          ref: ${{ job.workflow_sha }}
          path: .ci-esta
          persist-credentials: false
      - uses: ./.ci-esta/actions/ci-observability
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          run-attempt: ${{ inputs.run-attempt }}
          commit-sha: ${{ inputs.head-sha }}
          pull-request-number: ${{ inputs.pull-request-number }}
          required-gates-json: ${{ inputs.required-gates-json }}
          job-dependencies-json: ${{ inputs.job-dependencies-json }}
          analyze-critical-path: ${{ inputs.analyze-critical-path }}
          post-sticky: ${{ inputs.post-sticky }}
          work-selection-artifact: ${{ inputs.work-selection-artifact }}
          impact-comparisons-json: ${{ inputs.impact-comparisons-json }}
          sticky-key: ${{ inputs.sticky-key }}
          sticky-workflow: ${{ inputs.sticky-workflow }}
          lane-selection-artifact: ${{ inputs.lane-selection-artifact }}
          test-selection-artifact: ${{ inputs.test-selection-artifact }}
          full-suite-reference-artifact: ${{ inputs.full-suite-reference-artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: ci-esta-${{ inputs.run-id }}-${{ inputs.run-attempt }}
          path: |
            ci-observability.json
            ci-observability.md
            ci-observability.prom
          if-no-files-found: error
          retention-days: 30
