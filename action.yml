# Generated by scripts/public_actions.py; edit the canonical actions metadata.
name: Shared CI observability report
description: 'Render versioned CI latency, direct dependency, all-attempt runner-cost, job-admission, overlapping prior-run
  cost, sticky-comment, JSON artifact, and bounded Prometheus outputs.

  '
inputs:
  github-token:
    description: Token with actions:read and, when posting a sticky, pull-requests:write.
    required: true
  workflow-source-token:
    description: Optional read token for private reusable workflow repositories; used only for external workflow Contents
      reads.
    default: ''
  run-id:
    description: GitHub Actions run ID to observe.
    required: false
    default: ${{ github.run_id }}
  run-attempt:
    description: Current workflow run attempt.
    required: false
    default: ${{ github.run_attempt }}
  commit-sha:
    description: Optional expected source head; empty uses the observed run metadata.
    required: false
    default: ''
  pull-request-number:
    description: Pull request number for sticky publication; empty disables the sticky.
    required: false
    default: ''
  analyze-critical-path:
    description: Read source workflow topology as data at the run head and compute critical paths to explicit gates.
    default: 'false'
  job-dependencies-json:
    description: Complete prerequisite map keyed by observed job-name patterns, for critical-path analysis.
    default: '{}'
  required-gates-json:
    description: 'JSON array of explicit actions_job or commit_status gate selectors and sanitized direct prerequisites. Never
      pass arbitrary needs outputs.

      '
    required: false
    default: '[]'
  extensions-file:
    description: Optional JSON object containing typed consumer enrichment.
    required: false
    default: ''
  repository-signals-file:
    description: 'Optional JSON array of typed key/label/value signals rendered visibly in the sticky, such as pytest, coverage,
      cache, or image facts.

      '
    required: false
    default: ''
  report-output:
    description: Versioned exact-run JSON output path.
    required: false
    default: ci-observability.json
  markdown-output:
    description: Rendered sticky/summary Markdown output path.
    required: false
    default: ci-observability.md
  prometheus-output:
    description: Bounded Prometheus exposition output path.
    required: false
    default: ci-observability.prom
  post-sticky:
    description: Whether to upsert the marker-identified pull-request comment.
    required: false
    default: 'true'
  append-summary:
    description: Whether to append the rendered report to GITHUB_STEP_SUMMARY.
    required: false
    default: 'true'
  runner-sku-rates-json:
    description: 'Optional JSON array mapping runner labels to versioned SKU names and USD/minute rates. Exact dollar cost
      is withheld when any timed job is unmatched.

      '
    required: false
    default: '[]'
  test-selection-artifact:
    description: 'This run''s artifact holding the test-impact selection explanation (the test-impact action uploads it).
      Rendered as the sticky''s test-selection section, so only a report that posts the sticky reads it. Empty disables.

      '
    required: false
    default: test-impact-explanation
  full-suite-reference-artifact:
    description: 'Artifact holding the latest full-suite pytest timings, the baseline for the section''s saving. Read from
      any same-repository run; this run uploads its own when it ran every test file from a pull_request or push without coverage.
      Empty disables.

      '
    required: false
    default: ci-full-suite-reference-v1
  lane-selection-artifact:
    description: 'This run''s artifact holding a pytest-selective lane plan (plan-lanes uploads it as test-lane-selection).
      Rendered as the sticky''s lane section, with the runner time the skipped jobs took on the default branch''s last green
      push run. Empty disables.

      '
    required: false
    default: test-lane-selection
  work-selection-artifact:
    description: Optional provider-neutral ci-esta/work-selection/v1 artifact from the observed run.
    default: ''
  impact-comparisons-json:
    description: Optional benchmark pairs with exact run/attempt/head and gate, runner or step selectors. Values are collected
      from GitHub.
    default: '[]'
  sticky-key:
    description: 'Keys the sticky comment, for a repository that reports several workflows on one pull request; each key keeps
      its own comment. Empty keeps one.

      '
    required: false
    default: ''
  full-suite-reference-output:
    description: Where this run's own full-suite reference is written before upload.
    required: false
    default: ci-full-suite-reference.json
outputs:
  report-file:
    description: JSON report path.
    value: ${{ steps.action.outputs.report-file }}
  markdown-file:
    description: Markdown report path.
    value: ${{ steps.action.outputs.markdown-file }}
  prometheus-file:
    description: Prometheus exposition path.
    value: ${{ steps.action.outputs.prometheus-file }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/actions/ci-observability
    with:
      github-token: ${{ inputs.github-token }}
      workflow-source-token: ${{ inputs.workflow-source-token }}
      run-id: ${{ inputs.run-id }}
      run-attempt: ${{ inputs.run-attempt }}
      commit-sha: ${{ inputs.commit-sha }}
      pull-request-number: ${{ inputs.pull-request-number }}
      analyze-critical-path: ${{ inputs.analyze-critical-path }}
      job-dependencies-json: ${{ inputs.job-dependencies-json }}
      required-gates-json: ${{ inputs.required-gates-json }}
      extensions-file: ${{ inputs.extensions-file }}
      repository-signals-file: ${{ inputs.repository-signals-file }}
      report-output: ${{ inputs.report-output }}
      markdown-output: ${{ inputs.markdown-output }}
      prometheus-output: ${{ inputs.prometheus-output }}
      post-sticky: ${{ inputs.post-sticky }}
      append-summary: ${{ inputs.append-summary }}
      runner-sku-rates-json: ${{ inputs.runner-sku-rates-json }}
      test-selection-artifact: ${{ inputs.test-selection-artifact }}
      full-suite-reference-artifact: ${{ inputs.full-suite-reference-artifact }}
      lane-selection-artifact: ${{ inputs.lane-selection-artifact }}
      work-selection-artifact: ${{ inputs.work-selection-artifact }}
      impact-comparisons-json: ${{ inputs.impact-comparisons-json }}
      sticky-key: ${{ inputs.sticky-key }}
      full-suite-reference-output: ${{ inputs.full-suite-reference-output }}
