name: Check test policy routing
description: Execute project routing contracts through this action revision's installed policy CLI.
inputs:
  policy:
    description: Optional project exceptions to CI-esta defaults.
    default: ''
  work:
    description: Inline work inventory, identical to the planning action.
    default: ''
  lanes:
    description: Existing selector lane inventory, identical to the planning action.
    default: ''
  cases:
    description: JSON routing cases with explicit expected work IDs or failure codes.
    required: true
  workflow-cases:
    description: Optional event/selector scenarios evaluated through actual workflow action inputs.
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
        POLICY: ${{ inputs.policy }}
        CASES: ${{ inputs.cases }}
        WORK: ${{ inputs.work }}
        LANES: ${{ inputs.lanes }}
        WORKFLOW_CASES: ${{ inputs.workflow-cases }}
      run: |
        uv run --no-project --python 3.14 --with "${SHARED_ACTION_PATH}/../.." \
          python -m ci_esta.policy.verify "$POLICY" "$CASES" "$WORKFLOW_CASES" --work "$WORK" --lanes "$LANES"
