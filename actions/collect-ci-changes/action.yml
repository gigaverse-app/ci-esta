name: Collect changed CI inputs
description: Classify complete Git changes into workflow, action, shell and scanner
  inputs with conservative full fallback.
inputs:
  ci-paths:
    description: Newline separated CI paths to inspect.
    default: .github
  base-sha:
    description: Proven incremental base or the PR base commit.
    default: ${{ github.event.pull_request.base.sha }}
outputs:
  has-files:
    description: has files
    value: ${{ steps.changes.outputs.has-files }}
  has-security-files:
    description: has security files
    value: ${{ steps.changes.outputs.has-security-files }}
  ci-files:
    description: ci files
    value: ${{ steps.changes.outputs.ci-files }}
  security-files:
    description: security files
    value: ${{ steps.changes.outputs.security-files }}
  workflow-files:
    description: workflow files
    value: ${{ steps.changes.outputs.workflow-files }}
  action-files:
    description: action files
    value: ${{ steps.changes.outputs.action-files }}
  shell-files:
    description: shell files
    value: ${{ steps.changes.outputs.shell-files }}
  base-sha:
    description: base sha
    value: ${{ steps.changes.outputs.base-sha }}
runs:
  using: composite
  steps:
  - name: Resolve changed CI files
    id: changes
    env:
      CI_PATHS: ${{ inputs.ci-paths }}
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ inputs.base-sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    run: |
      set -euo pipefail

      ci_roots=()
      while IFS= read -r ci_root; do
        [ -n "$ci_root" ] || continue
        case "/$ci_root/" in
          /*/../*|//* ) echo "Invalid CI path: $ci_root" >&2; exit 2 ;;
        esac
        [ -e "$ci_root" ] || { echo "CI path does not exist: $ci_root" >&2; exit 2; }
        ci_roots+=("$ci_root")
      done <<EOF
      $CI_PATHS
      EOF
      [ "${#ci_roots[@]}" -gt 0 ] || { echo "At least one CI path is required" >&2; exit 2; }

      selected_z="$RUNNER_TEMP/ci-files.z"
      diff_base=""
      case "$EVENT_NAME" in
        pull_request)
          diff_base="$PR_BASE_SHA"
          git diff --name-only --diff-filter=ACMR -z "$diff_base" "$HEAD_SHA" -- "${ci_roots[@]}" > "$selected_z"
          ;;
        push)
          if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            diff_base="$PUSH_BEFORE_SHA"
            git diff --name-only --diff-filter=ACMR -z "$diff_base" "$HEAD_SHA" -- "${ci_roots[@]}" > "$selected_z"
          else
            find "${ci_roots[@]}" -type f -print0 > "$selected_z"
          fi
          ;;
        *)
          find "${ci_roots[@]}" -type f -print0 > "$selected_z"
          ;;
      esac

      ci_files="$RUNNER_TEMP/ci-files.txt"
      security_files="$RUNNER_TEMP/security-files.txt"
      workflow_files="$RUNNER_TEMP/workflow-files.txt"
      action_files="$RUNNER_TEMP/action-files.txt"
      shell_files="$RUNNER_TEMP/shell-files.txt"
      : > "$ci_files"
      : > "$security_files"
      : > "$workflow_files"
      : > "$action_files"
      : > "$shell_files"
      while IFS= read -r -d '' ci_file; do
        [ -f "$ci_file" ] || continue
        printf '%s\n' "$ci_file" >> "$ci_files"
        case "$ci_file" in
          .github/backend-common-bump.json|.github/backend-common-ref) ;;
          *) printf '%s\n' "$ci_file" >> "$security_files" ;;
        esac
        case "$ci_file" in
          .github/workflows/*.yml|.github/workflows/*.yaml)
            printf '%s\n' "$ci_file" >> "$workflow_files"
            ;;
        esac
        case "$ci_file" in
          */action.yml|*/action.yaml)
            printf '%s\n' "$ci_file" >> "$action_files"
            ;;
        esac
        case "$ci_file" in
          *.sh) printf '%s\n' "$ci_file" >> "$shell_files" ;;
        esac
      done < "$selected_z"

      write_output() {
        output_name="$1"
        output_file="$2"
        delimiter="ci_paths_${RANDOM}_${RANDOM}"
        {
          echo "$output_name<<$delimiter"
          cat "$output_file"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
      }
      write_output "ci-files" "$ci_files"
      write_output "security-files" "$security_files"
      write_output "workflow-files" "$workflow_files"
      write_output "action-files" "$action_files"
      write_output "shell-files" "$shell_files"
      echo "base-sha=$diff_base" >> "$GITHUB_OUTPUT"
      if [ -s "$ci_files" ]; then
        echo "has-files=true" >> "$GITHUB_OUTPUT"
      else
        echo "has-files=false" >> "$GITHUB_OUTPUT"
      fi
      if [ -s "$security_files" ]; then
        echo "has-security-files=true" >> "$GITHUB_OUTPUT"
      else
        echo "has-security-files=false" >> "$GITHUB_OUTPUT"
      fi
    shell: bash
