name: Collect complete PR change evidence
description: Fetch one complete, head-bound file list for test and security admission.
outputs:
  complete:
    description: Whether the PR head, base and file count matched the trigger throughout collection.
    value: ${{ steps.collect.outputs.complete }}
runs:
  using: composite
  steps:
    - id: collect
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          const fs = require('fs');
          const paths = ['complete-pr-paths.txt', 'complete-pr-changes.json'];
          for (const path of paths) fs.rmSync(path, {force: true});
          core.setOutput('complete', 'false');
          try {
            const expected = context.payload.pull_request;
            if (!expected) return;
            const params = {...context.repo, pull_number: expected.number};
            const matches = (pr) => pr.head.sha === expected.head.sha && pr.base.sha === expected.base.sha;
            const {data: before} = await github.rest.pulls.get(params);
            if (!matches(before)) throw new Error('PR head or base changed before collection');
            const files = await github.paginate(github.rest.pulls.listFiles, {...params, per_page: 100});
            const {data: after} = await github.rest.pulls.get(params);
            if (!matches(after) || before.changed_files !== files.length || after.changed_files !== files.length) {
              throw new Error('Incomplete or stale PR file list');
            }
            if (files.some(f => [f.filename, f.previous_filename].filter(Boolean).some(path => /[\r\n\0]/.test(path)))) {
              throw new Error('A path cannot be represented safely in the line-based selector input');
            }
            fs.writeFileSync(paths[0], files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean)).join('\n') + '\n');
            fs.writeFileSync(paths[1], JSON.stringify({base: expected.base.sha, head: expected.head.sha, complete: true, files}));
            core.setOutput('complete', 'true');
          } catch (error) {
            for (const path of paths) fs.rmSync(path, {force: true});
            core.warning(`Complete PR evidence unavailable: ${error.message}; retaining conservative validation.`);
          }
