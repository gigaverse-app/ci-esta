    description: Whether every unresolved failure was unioned into the tree delta.
    value: ${{ steps.action.outputs.reused-failures }}
  alternate-base:
    description: The PR base, offered beside an adopted validated-tree base; empty otherwise. Pass it to test-impact's alternate-base
      with alternate-changed-files.txt, which carries the unresolved failures too.
    value: ${{ steps.action.outputs.alternate-base }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/collect-pytest-changes
