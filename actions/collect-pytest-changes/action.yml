name: Collect pytest changed inputs
description: Adopt a proven base with its complete tree delta and unresolved failures. Uses EVENT_NAME, CURRENT_SHA, PR_BASE_SHA,
  BEFORE_SHA, PR_INCREMENTAL_BASE_SHA, FAILED_SHA and FAILURES_{COMPLETE,TRUNCATED,STALE,INVALID,COUNT,FILE} from env. Missing
  proof falls back to complete-pr-paths.txt or full-suite selection.
outputs:
  base:
    description: Base paired with changed-files.txt.
    value: ${{ steps.action.outputs.base }}
