name: Lint CI code
description: Validate GitHub Actions metadata, workflows, and shell with pinned, checksum-verified tools.

inputs:
  action-files:
    description: Newline-delimited changed composite action metadata files.
    required: false
    default: ""
  workflow-files:
    description: Newline-delimited changed GitHub workflow files.
    required: false
    default: ""
  shell-files:
    description: Newline-delimited changed standalone CI shell files.
    required: false
    default: ""
  base-sha:
    description: Diff base used to keep ShellCheck findings in changed code only; blank checks all lines.
    required: false
    default: ""
  head-sha:
    description: Diff head used to keep ShellCheck findings in changed code only.
    required: true

runs:
  using: composite
  steps:
    - name: Install checksum-verified Action Validator, Actionlint, and ShellCheck
      shell: bash
      run: |
        set -euo pipefail

        tool_dir="$RUNNER_TEMP/shared-ci-lint-tools"
        mkdir -p "$tool_dir"

        action_validator="$tool_dir/action-validator"
        curl --fail --silent --show-error --location \
          --output "$action_validator" \
          "https://github.com/mpalmer/action-validator/releases/download/v0.9.0/action-validator_linux_amd64"
        echo "9f42f94fca5b8d04c13bccfbb331104b37a9250650d89ae58dc888d46206f9b9  $action_validator" \
          | sha256sum --check --strict
        chmod +x "$action_validator"

        actionlint_archive="$tool_dir/actionlint.tar.gz"
        curl --fail --silent --show-error --location \
          --output "$actionlint_archive" \
          "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_archive" \
          | sha256sum --check --strict
        tar -xzf "$actionlint_archive" -C "$tool_dir" actionlint

        shellcheck_archive="$tool_dir/shellcheck.tar.xz"
        curl --fail --silent --show-error --location \
          --output "$shellcheck_archive" \
          "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
        echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" \
          | sha256sum --check --strict
        tar -xJf "$shellcheck_archive" -C "$tool_dir"
        mv "$tool_dir/shellcheck-v0.11.0/shellcheck" "$tool_dir/shellcheck"

        echo "$tool_dir" >> "$GITHUB_PATH"
        python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

    - name: Validate composite action schemas and shell blocks
      shell: bash
      env:
        ACTION_FILES: ${{ inputs.action-files }}
      run: |
        set -euo pipefail
        ACTION_FILES="${ACTION_FILES:-}"
        action_files=()
        while IFS= read -r action_file; do
          [ -n "$action_file" ] || continue
          [ -f "$action_file" ] || { echo "Action file does not exist: $action_file" >&2; exit 2; }
          action_files+=("$action_file")
        done <<EOF
        $ACTION_FILES
        EOF

        if [ "${#action_files[@]}" -gt 0 ]; then
          for action_file in "${action_files[@]}"; do
            action-validator "$action_file"
          done
          python3 "$GITHUB_ACTION_PATH/validate_actions.py" "${action_files[@]}"
        else
          echo "No changed composite action files to validate"
        fi

    - name: Lint CI workflows with Actionlint
      shell: bash
      env:
        WORKFLOW_FILES: ${{ inputs.workflow-files }}
      run: |
        set -euo pipefail
        WORKFLOW_FILES="${WORKFLOW_FILES:-}"

        workflow_files=()
        while IFS= read -r workflow_file; do
          [ -n "$workflow_file" ] || continue
          [ -f "$workflow_file" ] || { echo "Workflow file does not exist: $workflow_file" >&2; exit 2; }
          workflow_files+=("$workflow_file")
        done <<EOF
        $WORKFLOW_FILES
        EOF

        if [ "${#workflow_files[@]}" -gt 0 ]; then
          actionlint -shellcheck=- -color "${workflow_files[@]}"
        else
          echo "No changed workflow files to lint"
        fi

    - name: Lint changed workflow shell blocks
      shell: bash
      env:
        WORKFLOW_FILES: ${{ inputs.workflow-files }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        WORKFLOW_FILES="${WORKFLOW_FILES:-}"
        BASE_SHA="${BASE_SHA:-}"

        workflow_files=()
        while IFS= read -r workflow_file; do
          [ -n "$workflow_file" ] || continue
          workflow_files+=("$workflow_file")
        done <<EOF
        $WORKFLOW_FILES
        EOF
        [ "${#workflow_files[@]}" -gt 0 ] || { echo "No changed workflow shell blocks to lint"; exit 0; }

        diagnostics="$RUNNER_TEMP/actionlint-shellcheck.txt"
        if actionlint -shellcheck shellcheck -oneline -no-color "${workflow_files[@]}" > "$diagnostics" 2>&1; then
          exit 0
        fi
        python3 "$GITHUB_ACTION_PATH/filter_changed_diagnostics.py" \
          --base-sha "$BASE_SHA" \
          --head-sha "$HEAD_SHA" \
          --workflow-blocks \
          "$diagnostics"

    - name: Lint standalone CI shell files
      shell: bash
      env:
        SHELL_FILES: ${{ inputs.shell-files }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        SHELL_FILES="${SHELL_FILES:-}"
        BASE_SHA="${BASE_SHA:-}"

        shell_files=()
        while IFS= read -r shell_file; do
          [ -n "$shell_file" ] || continue
          [ -f "$shell_file" ] || { echo "Shell file does not exist: $shell_file" >&2; exit 2; }
          shell_files+=("$shell_file")
        done <<EOF
        $SHELL_FILES
        EOF

        if [ "${#shell_files[@]}" -gt 0 ]; then
          diagnostics="$RUNNER_TEMP/standalone-shellcheck.txt"
          if shellcheck --format=gcc "${shell_files[@]}" > "$diagnostics" 2>&1; then
            exit 0
          fi
          python3 "$GITHUB_ACTION_PATH/filter_changed_diagnostics.py" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            "$diagnostics"
        else
          echo "No changed standalone shell files to lint"
        fi
