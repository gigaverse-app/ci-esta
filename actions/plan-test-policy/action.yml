name: Plan test execution policy
description: Admit test work for an occasion before provisioning services; consume the existing selector's scope.
inputs:
  policy:
    description: Optional project exceptions to CI-esta v1 defaults, as YAML or JSON.
    default: ''
  profile:
    description: Optional override; otherwise affected, weekly on schedules, or the trusted PR label profile.
    default: ''
  labels:
    description: Trusted PR label names; full or affected-deep labels select the corresponding profile.
    default: ${{ toJSON(github.event.pull_request.labels.*.name || fromJSON('[]')) }}
  occasion:
    description: Normalized occasion or GitHub event name; inferred from this workflow by default.
    default: ${{ github.event_name }}
  revision:
    description: Immutable revision under test.
    default: ${{ github.sha }}
  affected:
    description: JSON IDs or complete ID-to-boolean map; null means unknown impact.
    default: 'null'
  requested:
    description: Explicit JSON work IDs, or null to use profile scope.
    default: 'null'
  environment:
    description: Target environment; does not grant environment access.
    default: ''
  deployed-revision:
    description: Revision observed by the existing deployment readiness check.
    default: ''
  work:
    description: Inline JSON work IDs or metadata objects; no policy file needed.
    default: ''
  lanes:
    description: Existing selector YAML/JSON file with authoritative lane IDs.
    default: ''
  inventory:
    description: Optional runner-generated inventory JSON file instead of policy work declarations.
    default: ''
  output:
    description: Destination for the authoritative plan artifact.
    default: test-policy-plan.json
outputs:
  profile:
    description: Resolved profile name.
    value: ${{ steps.plan.outputs.profile }}
  admitted:
    description: Complete work ID-to-boolean map for executor conditions.
    value: ${{ steps.plan.outputs.admitted }}
  fresh:
    description: Work ID-to-boolean map forbidding reuse for fresh probes.
    value: ${{ steps.plan.outputs.fresh }}
  count:
    description: Number of admitted work units.
    value: ${{ steps.plan.outputs.count }}
  plan:
    description: Complete versioned plan including deferral reasons.
    value: ${{ steps.plan.outputs.plan }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - id: plan
      shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
        POLICY: ${{ inputs.policy }}
        PROFILE: ${{ inputs.profile }}
        LABELS: ${{ inputs.labels }}
        OCCASION: ${{ inputs.occasion }}
        REVISION: ${{ inputs.revision }}
        AFFECTED: ${{ inputs.affected }}
        REQUESTED: ${{ inputs.requested }}
        TARGET_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOYED_REVISION: ${{ inputs.deployed-revision }}
        INVENTORY: ${{ inputs.inventory }}
        WORK: ${{ inputs.work }}
        LANES: ${{ inputs.lanes }}
        PLAN_OUTPUT: ${{ inputs.output }}
      run: |
        args=()
        if [ -n "$WORK" ]; then args+=(--work "$WORK"); fi
        if [ -n "$LANES" ]; then args+=(--lanes "$LANES"); fi
        if [ -n "$INVENTORY" ]; then args+=(--inventory "$INVENTORY"); fi
        uv run --no-project --python 3.14 --with "${SHARED_ACTION_PATH}/../.." \
          python -m ci_esta.policy.cli --policy "$POLICY" --profile "$PROFILE" \
          --labels "$LABELS" --occasion "$OCCASION" --revision "$REVISION" --affected "$AFFECTED" \
          --requested "$REQUESTED" --environment "$TARGET_ENVIRONMENT" \
          --deployed-revision "$DEPLOYED_REVISION" --output "$PLAN_OUTPUT" \
          --github-output "$GITHUB_OUTPUT" "${args[@]}"
