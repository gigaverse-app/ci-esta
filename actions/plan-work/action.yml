name: Plan complete lanes from tests and workflows
description: >
  Select CI lanes, inferred from the workflow or read from a lane file, from affected tests and CI-esta's workflow graph: a changed job or a
  file a job executes selects that job's lanes, and documentation no job reads selects nothing.
inputs:
  config:
    description: Optional lane file (the pytest-selective lane schema). Empty infers lanes from the workflows.
    default: ''
  base:
    description: Base commit containing the complete change set. A commit missing from the checkout runs every lane.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  pr-head:
    description: >-
      The pull request's head. When the checkout is GitHub's merge of it (refs/pull/N/merge), changes are measured from
      that merge's base-branch parent, so commits that landed on the base branch after `base` are not counted as the PR's.
      Empty (any other event) keeps `base`.
    default: ${{ github.event.pull_request.head.sha }}
  full:
    description: 'auto preserves selection on PR/push reruns and runs full for manual/scheduled/release checkpoints or test:full. Override with true or false.'
    default: auto
  artifact-name:
    description: Upload the lane plan under this name for CI-esta's report. Empty skips the upload.
    default: test-lane-selection
outputs:
  lanes:
    description: JSON object mapping lane names to booleans.
    value: ${{ steps.plan.outputs.lanes }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: false
    # Bun tests are planned from Bun's module graph. Without Bun the planner runs every lane holding them,
    # so a repository with Bun tests gets Bun here unless the caller installed it already.
    - id: bun
      shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
      # The same interpreter and environment the plan step reuses, so this costs no second install.
      run: |
        uv run --no-project --python 3.14 --with "${SHARED_ACTION_PATH}/../..[selection]" \
          python -m ci_esta.testing.bun.runtime --github-output "$GITHUB_OUTPUT"
    - if: ${{ steps.bun.outputs.install == 'true' }}
      uses: oven-sh/setup-bun@v2
      # A failed install leaves the planner's conservative fallback: every Bun lane runs.
      continue-on-error: true
      with:
        bun-version-file: ${{ steps.bun.outputs.version-file }}
    - uses: actions/cache@v5
      continue-on-error: true
      with:
        path: .test-impact
        key: ci-esta-plan-work-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: ci-esta-plan-work-${{ runner.os }}-
    - id: plan
      shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
        PLAN_CONFIG: ${{ inputs.config }}
        PLAN_BASE: ${{ inputs.base }}
        PLAN_PR_HEAD: ${{ inputs.pr-head }}
        PLAN_FULL: ${{ inputs.full }}
      run: |
        uv run --no-project --python 3.14 --with "${SHARED_ACTION_PATH}/../..[selection]" \
          python -m ci_esta.testing.work_plan ${PLAN_CONFIG:+--config "$PLAN_CONFIG"} --base "$PLAN_BASE" --pr-head "$PLAN_PR_HEAD" \
          --full "$PLAN_FULL" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
          | tee test-lanes.json
    - if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: test-lanes.json
        if-no-files-found: error
        # A rerun of the job replaces its plan instead of failing on the existing name.
        overwrite: true
