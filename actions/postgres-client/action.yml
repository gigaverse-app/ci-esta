name: Version-matched PostgreSQL client
description: Run Linux PostgreSQL clients from the same image as the service, independent of the runner image.
inputs:
  image:
    description: PostgreSQL image matching the service major version (or immutable image digest).
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLIENT_IMAGE: ${{ inputs.image }}
        CLIENT_ACTION: ${{ github.action_path }}
      run: bash "$CLIENT_ACTION/setup.sh"
