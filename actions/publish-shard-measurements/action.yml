name: Publish measured shard execution
description: Publish the local shard runner's process intervals for the CI-esta report.
inputs:
  path:
    description: Path to ci-esta-shards.json in the run-local log directory.
    required: true
  pool:
    description: Unique pool key within this job matrix, for example first-last shard indices.
    default: 'local'
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: ci-esta-shards-${{ github.job }}-${{ inputs.pool }}-${{ github.run_attempt }}
        path: ${{ inputs.path }}
        if-no-files-found: warn
        retention-days: 7
