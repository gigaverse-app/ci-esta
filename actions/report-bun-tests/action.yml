name: Report custom Bun execution
description: Convert an existing Bun runner's measured execution document into CI-esta work-selection evidence. Does not select or execute tests.
inputs:
  execution-file:
    description: JSON file matching the run-bun-tests execution shape (mode, reason, testedSha, bunVersion, totalFiles, executedFiles, durationMs, exitCode).
    required: true
  output-file:
    description: Provider-neutral work-selection JSON output.
    default: ci-work-selection.json
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPORT_MODULE: ${{ github.action_path }}/../run-bun-tests/work-report.mjs
        BUN_EXECUTION_FILE: ${{ inputs.execution-file }}
        BUN_WORK_REPORT: ${{ inputs.output-file }}
      run: node "$REPORT_MODULE"
