# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Resolve incremental PR base
description: 'Reuse the newest fresh, successful ancestor previously validated by this workflow for this exact pull request.
  Every uncertain case falls back to the supplied PR base so callers scan more rather than skip unproven work.

  '
inputs:
  fallback-base-sha:
    description: Pull request base SHA used when no reusable success is proven.
    required: true
  head-sha:
    description: Current pull request head SHA.
    required: true
  head-ref:
    description: Current pull request branch.
    required: true
  pr-number:
    description: Pull request number whose successful runs may be reused.
    required: true
  evidence-job-name:
    description: 'Stable job name (or reusable-workflow suffix) that must have concluded successfully in a reusable run. A
      caller prefix such as `validate / ` is ignored.

      '
    required: true
  cancelled-run-evidence-job-patterns:
    description: 'Newline-delimited glob patterns for every scanner job that must have succeeded before a cancelled workflow
      can be reused. Empty preserves the default fail-open behavior: cancelled workflows are not reusable.

      '
    required: false
    default: ''
  max-age-hours:
    description: Maximum age of reusable evidence; defaults to the weekly full-scan cadence.
    required: false
    default: '168'
  github-token:
    description: Token with actions:read, checks:read, and contents:read permissions.
    required: false
    default: ${{ github.token }}
outputs:
  base-sha:
    description: Proven successful ancestor, or fallback-base-sha.
    value: ${{ steps.action.outputs.base-sha }}
  reused:
    description: Whether base-sha came from a prior successful workflow run.
    value: ${{ steps.action.outputs.reused }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/resolve-incremental-pr-base
    with:
      fallback-base-sha: ${{ inputs.fallback-base-sha }}
      head-sha: ${{ inputs.head-sha }}
      head-ref: ${{ inputs.head-ref }}
      pr-number: ${{ inputs.pr-number }}
      evidence-job-name: ${{ inputs.evidence-job-name }}
      cancelled-run-evidence-job-patterns: ${{ inputs.cancelled-run-evidence-job-patterns }}
      max-age-hours: ${{ inputs.max-age-hours }}
      github-token: ${{ inputs.github-token }}
