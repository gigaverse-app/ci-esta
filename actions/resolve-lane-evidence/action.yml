name: Resolve independent validation evidence
description: Reuse successful first-attempt lanes with matching validation inputs and completion receipts.
inputs:
  lanes:
    description: JSON object mapping output keys to exact job names.
    required: true
  selection-keys:
    description: Optional JSON list of selector lane keys that define this execution's coverage.
    default: '[]'
  selection:
    description: Selected lane booleans. Unknown values execute the lane and forbid evidence reuse.
    default: '{}'
  selection-outcome:
    description: Outcome of the selector step; only success can establish deterministic coverage.
    default: success
  selection-report:
    description: Native selector report with lanes and a non-fallback reason; required with selection-keys.
    default: ''
  allow-reuse:
    description: Whether this occasion may consume or issue evidence; false preserves fresh execution.
    default: 'true'
  execution-context:
    description: >-
      Optional deterministic description of runtime-selected work, such as the selected
      test lanes. Different values require different receipts. Keep job names stable:
      any later failed execution of that job conservatively revokes earlier proof.
    default: ''
  input-paths:
    description: >-
      Optional JSON array of complete repository-relative execution inputs. When set,
      receipts bind these files/directories from the tested merge instead of the entire
      tree. Include workflow, setup scripts, dependency locks and upstream revision pins.
      Unchanged inputs still require a proven passing lane; a path match alone never skips.
    default: '[]'
  reuse-after-merge:
    description: Reuse matching PR receipts on first-attempt branch pushes; requires complete input-paths.
    default: 'false'
  reuse-version-only-release:
    description: Reuse a validated base for strict root Python Release Please version changes; requires input-paths, full Git history and Python 3.11+.
    default: 'false'
  dependency-token:
    description: >-
      Read access to backend-common. With it, a backend-common pin counts as the tree it
      installs, so a retag between commits of one tree (PR<N> to v<N>) reuses every lane.
      Without it pins are compared exactly.
    default: ''
outputs:
  release-only:
    description: Whether strict version-only classification found a merged validation source. Packaging checks must still run.
    value: ${{ steps.resolve.outputs.release-only }}
  selection:
    description: Normalized execution scope for selection-keys; unknown lanes run.
    value: ${{ steps.resolve.outputs.selection }}
  context:
    description: Exact execution scope bound into the completion receipt.
    value: ${{ steps.resolve.outputs.context }}
  reusable:
    description: Whether the selector report proves this exact deterministic scope.
    value: ${{ steps.resolve.outputs.reusable }}
  matrix:
    description: Lane keys lacking literal successful proof; all keys when all are proven (gate the job separately).
    value: ${{ steps.resolve.outputs.matrix }}
  receipt:
    description: Completion step name binding consumer merge tree and downloaded shared tooling.
    value: ${{ steps.resolve.outputs.receipt }}
  reused:
    description: JSON object of positively proven lane keys.
    value: ${{ steps.resolve.outputs.reused }}
runs:
  using: composite
  steps:
    - id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        SELECTION_KEYS: ${{ inputs.selection-keys }}
        SELECTION: ${{ inputs.selection }}
        SELECTION_OUTCOME: ${{ inputs.selection-outcome }}
        SELECTION_REPORT: ${{ inputs.selection-report }}
        ALLOW_REUSE: ${{ inputs.allow-reuse }}
        EVIDENCE_LANES: ${{ inputs.lanes }}
        EVIDENCE_EXECUTION_CONTEXT: ${{ inputs.execution-context }}
        EVIDENCE_INPUT_PATHS: ${{ inputs.input-paths }}
        REUSE_AFTER_MERGE: ${{ inputs.reuse-after-merge }}
        REUSE_VERSION_ONLY_RELEASE: ${{ inputs.reuse-version-only-release }}
        TESTED_MERGE_SHA: ${{ github.sha }}
        DEPENDENCY_TOKEN: ${{ inputs.dependency-token }}
      with:
        # A dropped connection must not turn a normalized receipt into an exact-pin
        # fallback and rerun every lane. github-script also applies this bounded
        # policy to the dependency-token client; exhausted reads still fall back safely.
        retries: 2
        script: |
          const reused = {};
          const measuredLanes = [];
          const { executionScope, pendingMatrix } = require(`${process.env.GITHUB_ACTION_PATH}/selection.cjs`);
          const lanes = JSON.parse(process.env.EVIDENCE_LANES);
          const keys = JSON.parse(process.env.SELECTION_KEYS || '[]');
          let executionContext = process.env.EVIDENCE_EXECUTION_CONTEXT || '';
          core.setOutput('reused', '{}');
          core.setOutput('matrix', JSON.stringify(pendingMatrix(Object.keys(lanes), {})));
          let scope;
          if (keys.length) {
            if (executionContext) throw new Error('Use selection-keys or execution-context, not both');
            let report;
            try { report = require('fs').readFileSync(process.env.SELECTION_REPORT, 'utf8'); } catch { /* Missing evidence executes fresh. */ }
            scope = executionScope(keys, process.env.SELECTION, process.env.SELECTION_OUTCOME, report);
            executionContext = scope.context;
            core.setOutput('selection', JSON.stringify(scope.selected));
            core.setOutput('reusable', scope.reusable);
          }
          core.setOutput('context', executionContext);
          if (process.env.ALLOW_REUSE === 'false' || (scope && (!scope.reusable || !Object.values(scope.selected).some(Boolean)))) {
            core.setOutput('receipt', '');
            return;
          }
          const { testedIdentity, inventoryIdentity, validationReceipt } = require(`${process.env.GITHUB_ACTION_PATH}/inputs.cjs`);
          const shared = process.env.DEPENDENCY_TOKEN ? getOctokit(process.env.DEPENDENCY_TOKEN) : null;
          let tested;
          const paths = JSON.parse(process.env.EVIDENCE_INPUT_PATHS || '[]');
          const {proofTarget} = require(`${process.env.GITHUB_ACTION_PATH}/merged.cjs`);
          const target = await proofTarget({github,context,core,paths,actionPath:process.env.GITHUB_ACTION_PATH,
            sha:process.env.TESTED_MERGE_SHA,attempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            afterMerge:process.env.REUSE_AFTER_MERGE === 'true',
            releaseVersion:process.env.REUSE_VERSION_ONLY_RELEASE === 'true'});
          core.setOutput('release-only', target.releaseOnly);

          try {
            tested = paths.length
              ? await inventoryIdentity(github, shared, context.repo, target.sha, paths)
              : await testedIdentity(github, shared, context.repo, process.env.TESTED_MERGE_SHA, core);
          } catch (error) {
            // The SHA still pins the tree and parents exactly, so it stays sound; it only
            // cannot match a re-created merge of the same tree.
            core.warning(`Could not read tested merge ${process.env.TESTED_MERGE_SHA} (${error.message}); only runs of this exact merge commit can be reused.`);
            tested = `commit ${process.env.TESTED_MERGE_SHA}`;
          }
          const receipt = validationReceipt(process.env.GITHUB_ACTION_PATH, tested, executionContext, target.manifests);
          core.setOutput('receipt', receipt);
          const pr = target.pr;
          if ((context.eventName === 'pull_request' || (context.eventName === 'push' && process.env.REUSE_AFTER_MERGE === 'true')) && Number(process.env.GITHUB_RUN_ATTEMPT) === 1 &&
              pr?.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
            const { resolveIncrementalPrBase } = require(`${process.env.GITHUB_ACTION_PATH}/../resolve-incremental-pr-base/resolve.cjs`);
            const evidenceCache = new Map();
            for (const [key, jobName] of Object.entries(lanes)) {
              const result = await resolveIncrementalPrBase({
                github, context, core, evidenceCache, fallbackBaseSha: pr.base.sha, headSha: pr.head.sha,
                headRef: pr.head.ref, pullRequestNumber: pr.number,
                evidenceJobName: jobName, evidenceStepName: receipt,
                sameHeadOnly: true, maxAgeHours: 24,
                conservativeFailures: paths.length > 0 || executionContext !== '',
                onReuse: ({run, jobs}) => {
                  for (const job of jobs) {
                    const seconds = (Date.parse(job.completed_at) - Date.parse(job.started_at)) / 1000;
                    measuredLanes.push({lane: key, job: job.name,
                      source_run_id: run.id, source_attempt: run.run_attempt,
                      source_head_sha: run.head_sha, source_job_id: job.id,
                      source_seconds: Number.isFinite(seconds) && seconds >= 0 ? seconds : null});
                  }
                },
              });
              if (result.reused) reused[key] = true;
            }
          }
          core.setOutput('reused', JSON.stringify(reused));
          core.setOutput('matrix', JSON.stringify(pendingMatrix(Object.keys(lanes), reused)));
          try {
            const fs = require('fs');
            const path = require('path');
            const suffix = require('crypto').createHash('sha256').update(process.env.EVIDENCE_LANES).digest('hex').slice(0, 12);
            const name = `ci-esta-reuse-${process.env.GITHUB_JOB}-${suffix}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const file = path.join(process.env.RUNNER_TEMP, `${name}.json`);
            fs.writeFileSync(file, JSON.stringify({schema_version: 'ci-esta/reuse/v1',
              run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              head_sha: context.payload.pull_request?.head.sha || context.sha, receipt, execution_context: executionContext, lanes: measuredLanes}));
            core.setOutput('measurement-path', file);
            core.setOutput('measurement-name', name);
          } catch (error) {
            core.warning(`Reuse measurements unavailable: ${error.message}`);
          }
    - name: "PR evidence #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}"
      if: github.event_name == 'pull_request'
      shell: bash
      run: 'true'
    - name: Publish reuse measurements
      if: steps.resolve.outputs.measurement-path != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.resolve.outputs.measurement-name }}
        path: ${{ steps.resolve.outputs.measurement-path }}
        retention-days: 7
