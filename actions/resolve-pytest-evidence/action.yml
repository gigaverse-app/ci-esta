    description: Run containing candidate failure artifacts.
    value: ${{ steps.action.outputs.failed-run-id }}
  failed-shard-count:
    description: Exact number of candidate shard reports required.
    value: ${{ steps.action.outputs.failed-shard-count }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/resolve-pytest-evidence
    with:
      plan-job-name: ${{ inputs.plan-job-name }}
      test-job-pattern: ${{ inputs.test-job-pattern }}
      completion-step-name: ${{ inputs.completion-step-name }}
      success-status-context: ${{ inputs.success-status-context }}
      github-token: ${{ inputs.github-token }}
