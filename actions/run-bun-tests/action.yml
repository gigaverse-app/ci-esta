name: Run Bun affected tests
description: Run repository-discovered Bun tests with conservative selection and execution evidence. Requires Bun >=1.4.2 <2 already installed.
inputs:
  inventory:
    description: JSON file with ci-esta/bun-inventory/v1 files and alwaysRunFiles, produced by repository discovery.
    required: true
  policy:
    description: Repository-owned selection policy JSON.
    required: true
  base:
    description: Exact comparison commit; use a recorded tested merge together with validated-head. Missing history executes the full inventory.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  validated-head:
    description: Optional proven PR head, which must be the comparison merge's second parent and an ancestor of the current checkout.
    default: ''
  full:
    description: 'auto keeps PR/push reruns selective and runs full for manual/scheduled/release checkpoints or test:full. Override with true or false.'
    default: 'auto'
  args:
    description: JSON array of Bun execution flags; default preserves per-file isolation and parallel execution.
    default: '["--isolate","--parallel"]'
  shards:
    description: Number of sequential fresh-process batches on this runner, partitioning the complete sorted inventory.
    default: '1'
  output-directory:
    description: Fresh output directory outside tracked inputs.
    default: '${{ runner.temp }}/bun-test-selection'
outputs:
  python-path:
    description: Python module search path for this pinned toolkit, for consumer controls using its native API.
    value: ${{ steps.run.outputs.python-path }}
  mode:
    description: full, scoped or none. This is selection intent, never a completion receipt.
    value: ${{ steps.run.outputs.mode }}
  fallback:
    description: Whether uncertain selection forced the full inventory.
    value: ${{ steps.run.outputs.fallback }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - id: run
      shell: bash
      env:
        SHARED_ACTION_PATH: ${{ github.action_path }}
        BUN_TEST_INVENTORY: ${{ inputs.inventory }}
        BUN_TEST_POLICY: ${{ inputs.policy }}
        BUN_TEST_BASE: ${{ inputs.base }}
        BUN_TEST_VALIDATED_HEAD: ${{ inputs.validated-head }}
        BUN_TEST_FULL: ${{ inputs.full }}
        BUN_TEST_ARGS: ${{ inputs.args }}
        BUN_TEST_SHARDS: ${{ inputs.shards }}
        BUN_TEST_OUTPUT: ${{ inputs.output-directory }}
      run: |
        export PYTHONPATH="$SHARED_ACTION_PATH/../../src"
        CI_ESTA_PYTHON=$(bash "$SHARED_ACTION_PATH/../../scripts/ci/tool-runtime.sh" --prepare)
        echo "CI_ESTA_PYTHON=$CI_ESTA_PYTHON" >> "$GITHUB_ENV"
        echo "python-path=$PYTHONPATH" >> "$GITHUB_OUTPUT"
        "$CI_ESTA_PYTHON" -m ci_esta.testing.bun.cli run
