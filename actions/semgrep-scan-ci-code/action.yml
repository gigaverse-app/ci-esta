name: Scan CI code with Semgrep
description: Scan an exact changed-file list with Semgrep on an existing Docker-capable runner.

inputs:
  ci-files:
    description: Newline-delimited changed repository-relative CI-code files.
    required: false
    default: ""
  configs:
    description: Space-separated Semgrep registry configurations.
    required: false
    default: "p/default p/python p/security-audit p/owasp-top-ten p/dockerfile p/secrets"

runs:
  using: composite
  steps:
    - name: Use the pinned Semgrep image
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../semgrep-scan/setup.sh"
    - name: Run targeted Semgrep scan
      shell: sh
      env:
        CI_FILES: ${{ inputs.ci-files }}
        SEMGREP_CONFIGS: ${{ inputs.configs }}
      run: |
        set -eu

        set -- scan
        for config in $SEMGREP_CONFIGS; do
          set -- "$@" --config "$config"
        done
        set -- "$@" --severity ERROR --error --

        target_count=0
        while IFS= read -r ci_file; do
          [ -n "$ci_file" ] || continue
          [ -f "$ci_file" ] || { echo "CI file does not exist: $ci_file" >&2; exit 2; }
          set -- "$@" "$ci_file"
          target_count=$((target_count + 1))
        done <<EOF
        $CI_FILES
        EOF
        [ "$target_count" -gt 0 ] || { echo "At least one CI file is required" >&2; exit 2; }

        semgrep "$@"
