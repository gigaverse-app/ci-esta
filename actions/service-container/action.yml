name: Prepare a test service container
description: Optionally prefetch an image during dependency setup, then require a healthy service before tests.
inputs:
  phase:
    description: warm starts an advisory background pull; start requires health; stop removes the named container.
    default: start
  name:
    description: Container name unique within this runner. Reuse it for stop in an always() step.
    required: true
  image:
    description: Docker image. Required for warm and start.
    default: ''
  ports:
    description: One Docker port mapping per line.
    default: ''
  health-command:
    description: Container health command. Required for start.
    default: ''
  timeout-seconds:
    description: Maximum health wait after docker run finishes.
    default: '30'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SERVICE_PHASE: ${{ inputs.phase }}
        SERVICE_NAME: ${{ inputs.name }}
        SERVICE_IMAGE: ${{ inputs.image }}
        SERVICE_PORTS: ${{ inputs.ports }}
        SERVICE_HEALTH_COMMAND: ${{ inputs.health-command }}
        SERVICE_TIMEOUT: ${{ inputs.timeout-seconds }}
        SERVICE_ACTION_PATH: ${{ github.action_path }}
      run: bash "$SERVICE_ACTION_PATH/service.sh"
