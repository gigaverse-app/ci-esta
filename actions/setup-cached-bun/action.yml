name: Set up Bun with measured dependency caching
description: Install pinned Bun, restore its download cache, always install the lockfile, and publish cache measurements.
inputs:
  bun-version-file:
    description: Repository-relative file containing the pinned Bun version.
    default: .bun-version
  working-directory:
    description: Directory containing bun.lock.
    default: .
  cache-salt:
    description: Optional namespace for cold/warm experiments.
    default: ''
  measurement-name:
    description: Cache identity in the report; make this distinct for multiple setups in one job.
    default: Bun dependencies
  job-name:
    description: Exact displayed Actions job name, including matrix values if present.
    default: ${{ github.job }}
outputs:
  cache-hit:
    description: True only for an exact dependency download cache hit; installation still runs.
    value: ${{ steps.restore.outputs.cache-hit }}
  bun-version:
    description: Installed Bun version.
    value: ${{ steps.bun.outputs.bun-version }}
  measurement-path:
    description: Published measurement JSON, useful for smoke verification.
    value: ${{ steps.measurement.outputs.measurement-path }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      id: bun
      with:
        bun-version-file: ${{ inputs.bun-version-file }}
    - id: identity
      shell: bash
      env:
        BUN_CACHE_SCRIPT: ${{ github.action_path }}/../../scripts/ci/bun_cache.py
        BUN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        BUN_CACHE_PREFIX: ci-esta-bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ inputs.cache-salt }}-${{ hashFiles('patches/**') }}-
        BUN_CACHE_INPUTS: ${{ hashFiles('**/bun.lock', '**/package.json', '!**/node_modules/**') }}
      run: python3 "$BUN_CACHE_SCRIPT" identity
    - id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}
    - id: restore-time
      shell: bash
      env:
        BUN_CACHE_SCRIPT: ${{ github.action_path }}/../../scripts/ci/bun_cache.py
        CACHE_STARTED: ${{ steps.identity.outputs.started }}
      run: python3 "$BUN_CACHE_SCRIPT" clock
    - id: sync
      shell: bash
      env:
        BUN_CACHE_SCRIPT: ${{ github.action_path }}/../../scripts/ci/bun_cache.py
        BUN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: python3 "$BUN_CACHE_SCRIPT" sync
    - id: save
      if: ${{ success() && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ${{ steps.identity.outputs.key }}
    - id: save-time
      if: ${{ !cancelled() && steps.save.outcome != 'skipped' && steps.sync.outputs.started != '' }}
      shell: bash
      env:
        BUN_CACHE_SCRIPT: ${{ github.action_path }}/../../scripts/ci/bun_cache.py
        CACHE_STARTED: ${{ steps.sync.outputs.started }}
      run: python3 "$BUN_CACHE_SCRIPT" clock
    - name: Record Bun dependency cache
      id: measurement
      if: ${{ always() && steps.identity.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        MEASUREMENT_SCRIPT: ${{ github.action_path }}/../../scripts/ci/record_measurement.py
        MEASUREMENT_JOB: ${{ inputs.job-name }}
        MEASUREMENT_SCOPE: ${{ inputs.measurement-name }}
        CACHE_KIND: download
        CACHE_PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        CACHE_RESTORE_SECONDS: ${{ steps.restore-time.outputs.seconds }}
        CACHE_SAVE_SECONDS: ${{ steps.save-time.outputs.seconds }}
        CACHE_SYNC_SECONDS: ${{ steps.sync.outputs.seconds }}
        CACHE_SYNC_OUTCOME: ${{ steps.sync.outcome }}
      run: python3 "$MEASUREMENT_SCRIPT" cache-operation
    - name: Publish Bun dependency cache
      if: ${{ always() && steps.measurement.outputs.measurement-path != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ steps.measurement.outputs.measurement-name }}
        path: ${{ steps.measurement.outputs.measurement-path }}
        retention-days: 7
