# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Restore a validated Python environment
description: Cache a complete uv environment with exact installation identity, repair broken restores, and always verify the
  lock.
inputs:
  uv-version:
    description: Exact uv version; match this to a production exporter or lockfile contract when required.
    default: 0.11.19
  python-version:
    description: Python version to install; the cache uses the resolved patch and architecture.
    default: '3.14'
  working-directory:
    description: Project or workspace directory, relative to the checkout.
    default: .
  sync-args:
    description: Dependency group/extra/workspace flags for uv sync; locked verification is mandatory.
    default: ''
  cache-variant:
    description: Additional caller-owned identity for ABI, system dependencies or runner image changes.
    default: ''
  cache-salt:
    description: Optional isolated cache namespace for cold/warm experiments.
    default: ''
  cache-environment:
    description: Restore/save the expanded .venv. Disable when recreating from uv's download cache is faster; locked sync
      always runs.
    default: 'true'
  private-dependency-token:
    description: Optional GitHub read token scoped to the locked sync subprocess, never saved in Git configuration.
    default: ''
outputs:
  cache-hit:
    description: Exact cache entry found; locked synchronization still verifies it.
    value: ${{ steps.action.outputs.cache-hit }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/setup-cached-uv
    with:
      uv-version: ${{ inputs.uv-version }}
      python-version: ${{ inputs.python-version }}
      working-directory: ${{ inputs.working-directory }}
      sync-args: ${{ inputs.sync-args }}
      cache-variant: ${{ inputs.cache-variant }}
      cache-salt: ${{ inputs.cache-salt }}
      cache-environment: ${{ inputs.cache-environment }}
      private-dependency-token: ${{ inputs.private-dependency-token }}
