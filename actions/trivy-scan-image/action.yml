name: Trivy scan inventory
description: >
  Run Trivy against an image or filesystem package inventory with the shared
  org severity policy. Centralizes the Trivy version and the CRITICAL/HIGH +
  ignore-unfixed gate so every consumer scans identically.

# Inventory creation is intentionally NOT part of this action. Consumers build
# their OS image or materialize their language environment, then identify it
# with image-ref or scan-ref. Keeping those concerns separate lets uv remain
# authoritative for Python resolution while Trivy remains authoritative for CVEs.

inputs:
  scan-type:
    description: Trivy scan type (normally image or fs).
    required: false
    default: "image"
  image-ref:
    description: Local image tag for scan-type image (must already be built and loaded).
    required: false
    default: ""
  scan-ref:
    description: Filesystem path for scan-type fs.
    required: false
    default: "."
  vuln-type:
    description: Comma-separated package inventories to scan (os,library).
    required: false
    default: "os,library"
  scanners:
    description: Trivy scanners to enable; source and secret scanning belongs to the shared Semgrep gate.
    required: false
    default: "vuln"
  skip-dirs:
    description: Comma-separated inventory subdirectories to exclude.
    required: false
    default: ""
  cache:
    description: Restore/save Trivy caches; disable on a second scan in the same job.
    required: false
    default: "true"
  skip-setup-trivy:
    description: Reuse Trivy already installed by an earlier invocation in this job.
    required: false
    default: "false"
  trivy-version:
    description: Trivy CLI version installed by trivy-action.
    required: false
    default: "v0.72.0"
  severity:
    description: Comma-separated severities that fail the scan.
    required: false
    default: "CRITICAL,HIGH"
  ignore-unfixed:
    description: Skip vulnerabilities that have no fix available yet.
    required: false
    default: "true"
  exit-code:
    description: Process exit code when vulnerabilities at `severity` are found.
    required: false
    default: "1"
  format:
    description: Trivy output format.
    required: false
    default: "table"

runs:
  using: composite
  steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        scan-ref: ${{ inputs.scan-ref }}
        vuln-type: ${{ inputs.vuln-type }}
        scanners: ${{ inputs.scanners }}
        skip-dirs: ${{ inputs.skip-dirs }}
        cache: ${{ inputs.cache }}
        skip-setup-trivy: ${{ inputs.skip-setup-trivy }}
        version: ${{ inputs.trivy-version }}
        format: ${{ inputs.format }}
        exit-code: ${{ inputs.exit-code }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
