# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Scope a type check to what a change can affect
description: 'From a base that is proven to check clean, list the checked files whose import closure reaches a change (pytest_selective.typecheck_scope).
  Any doubt is the full check: no proof for the base, a changed global input, an unreadable pattern, a failed fetch or computation,
  or a scope nearly as large as the project.'
inputs:
  config:
    description: The consumer's test-impact dependency graph configuration.
    required: true
  base:
    description: The base to diff from, normally the PR base.
    required: true
  head:
    description: The checked-out commit.
    default: HEAD
  checker-config:
    description: The checker's config file (pyright-family), read for its include and exclude.
    default: pyrightconfig.json
  global-inputs:
    description: 'Whitespace-separated fnmatch patterns whose change alters every verdict: configuration, the lock and manifest,
      stubs (list both `*.pyi` and `**/*.pyi`), and any path the checker resolves imports from but the graph''s module roots
      do not model.'
    required: true
  max-fraction:
    description: Scope size, as a fraction of checked files, at or above which the full check runs.
    default: '0.6'
  clean-base-checks:
    description: Newline-separated check-run names (they contain spaces, such as `type-check / basedpyright`). The base is
      proven clean only by a successful check run with one of these names on the base commit itself.
    required: true
outputs:
  mode:
    description: scoped (check `paths`), full, or none (no checked file can have changed).
    value: ${{ steps.action.outputs.mode }}
  paths:
    description: Newline-separated files to check when mode is scoped.
    value: ${{ steps.action.outputs.paths }}
  reason:
    description: Why this mode.
    value: ${{ steps.action.outputs.reason }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/typecheck-scope
    with:
      config: ${{ inputs.config }}
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      checker-config: ${{ inputs.checker-config }}
      global-inputs: ${{ inputs.global-inputs }}
      max-fraction: ${{ inputs.max-fraction }}
      clean-base-checks: ${{ inputs.clean-base-checks }}
