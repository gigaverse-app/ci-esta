# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Cancel obsolete PR workflow runs
description: 'Cancel active runs of this same workflow and PR when their head SHA is no longer current. Call from an existing
  first-attempt job so the cancellation closes the post-admission race without creating another billed runner job.

  '
inputs:
  pr-number:
    description: Pull request whose current head is authoritative.
    required: true
  current-head-sha:
    description: Current pull-request head SHA.
    required: true
  head-ref:
    description: Same-repository pull-request head branch.
    required: true
  github-token:
    description: Token with actions:write, checks:read and contents:read permissions in the calling job.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/cancel-obsolete-pr-runs
    with:
      pr-number: ${{ inputs.pr-number }}
      current-head-sha: ${{ inputs.current-head-sha }}
      head-ref: ${{ inputs.head-ref }}
      github-token: ${{ inputs.github-token }}
