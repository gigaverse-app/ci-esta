# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Shared CI observability enrichment
description: "Run one ci_esta.ci_observability.enrichment subcommand without needing the repo's synced virtualenv \u2014 the\
  \ runtime is ensured on the runner's python3 and the module runs from this action's checkout. Jobs that already carry a\
  \ synced venv can invoke the module directly instead.\n"
inputs:
  mode:
    description: 'Subcommand: capture-pytest, build-backend, build-ai, legacy-metrics, adopt-legacy-sticky, or render-selection.

      '
    required: true
  shard-count:
    description: Shard count whose timings are being captured.
    required: false
    default: ''
  wall-time:
    description: Wall-clock pytest time (e.g. "1m 34s" or seconds).
    required: false
    default: ''
  total-time:
    description: Summed per-test pytest time.
    required: false
    default: ''
  timings-output:
    description: capture-pytest metadata JSON output path.
    required: false
    default: ci-pytest-timings.json
  artifacts-dir:
    description: 'Artifact directory: coverage/junit/timeline bundle for build-backend, build metrics.prom tree for build-ai
      deploy runs. Empty uses the subcommand''s default.

      '
    required: false
    default: ''
  extension-output:
    description: Typed extension JSON output path.
    required: false
    default: ci-observability-extension.json
  signals-output:
    description: Repository-signal JSON output path.
    required: false
    default: ci-observability-signals.json
  workflow-class:
    description: One of python_tests, type_check, non_default_tests, deploy.
    required: false
    default: ''
  pytest-shard-count:
    description: Shard count for python_tests runs; empty records it as unavailable.
    required: false
    default: ''
  pytest-wall-time:
    description: Wall-clock pytest time for build-ai python_tests runs.
    required: false
    default: ''
  pytest-total-time:
    description: Summed per-test pytest time for build-ai python_tests runs.
    required: false
    default: ''
  report:
    description: Shared ci-observability.json report path.
    required: false
    default: ci-observability.json
  extension:
    description: Extension JSON path rendered by build-backend.
    required: false
    default: ci-observability-extension.json
  metrics-output:
    description: legacy-metrics Prometheus output path.
    required: false
    default: ci-timing-legacy.prom
  explanation:
    description: gv-test-impact affected --explanation-output file.
    required: false
    default: test-impact-explanation.json
  full-suite-reference:
    description: 'Measured full-suite run JSON the saving is computed against; empty or missing leaves the saving unknown.

      '
    required: false
    default: ''
  selection-output:
    description: Rendered test-selection Markdown section path.
    required: false
    default: ci-test-selection.md
  pull-request:
    description: Pull request number whose legacy sticky is adopted.
    required: false
    default: ''
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/ci-observability-enrichment
    with:
      mode: ${{ inputs.mode }}
      shard-count: ${{ inputs.shard-count }}
      wall-time: ${{ inputs.wall-time }}
      total-time: ${{ inputs.total-time }}
      timings-output: ${{ inputs.timings-output }}
      artifacts-dir: ${{ inputs.artifacts-dir }}
      extension-output: ${{ inputs.extension-output }}
      signals-output: ${{ inputs.signals-output }}
      workflow-class: ${{ inputs.workflow-class }}
      pytest-shard-count: ${{ inputs.pytest-shard-count }}
      pytest-wall-time: ${{ inputs.pytest-wall-time }}
      pytest-total-time: ${{ inputs.pytest-total-time }}
      report: ${{ inputs.report }}
      extension: ${{ inputs.extension }}
      metrics-output: ${{ inputs.metrics-output }}
      explanation: ${{ inputs.explanation }}
      full-suite-reference: ${{ inputs.full-suite-reference }}
      selection-output: ${{ inputs.selection-output }}
      pull-request: ${{ inputs.pull-request }}
