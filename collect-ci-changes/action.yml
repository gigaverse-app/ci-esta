# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Collect changed CI inputs
description: Classify complete Git changes into workflow, action, shell and scanner inputs with conservative full fallback.
inputs:
  ci-paths:
    description: Newline separated CI paths to inspect.
    default: .github
  base-sha:
    description: Proven incremental base or the PR base commit.
    default: ${{ github.event.pull_request.base.sha }}
outputs:
  has-files:
    description: has files
    value: ${{ steps.action.outputs.has-files }}
  has-security-files:
    description: has security files
    value: ${{ steps.action.outputs.has-security-files }}
  ci-files:
    description: ci files
    value: ${{ steps.action.outputs.ci-files }}
  security-files:
    description: security files
    value: ${{ steps.action.outputs.security-files }}
  workflow-files:
    description: workflow files
    value: ${{ steps.action.outputs.workflow-files }}
  action-files:
    description: action files
    value: ${{ steps.action.outputs.action-files }}
  shell-files:
    description: shell files
    value: ${{ steps.action.outputs.shell-files }}
  base-sha:
    description: base sha
    value: ${{ steps.action.outputs.base-sha }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/collect-ci-changes
    with:
      ci-paths: ${{ inputs.ci-paths }}
      base-sha: ${{ inputs.base-sha }}
