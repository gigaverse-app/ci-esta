name: Decide coverage admission
description: Opt-in PR coverage and weekly main coverage, independent of test selection.
inputs:
  explicit:
    description: Explicit manual or reusable-workflow coverage request.
    default: 'false'
outputs:
  enabled:
    description: Whether to collect and publish complete coverage.
    value: ${{ steps.action.outputs.enabled }}
  marker:
    description: Artifact name to record successful coverage on main.
    value: ${{ steps.action.outputs.marker }}
  reason:
    description: Why coverage was enabled or skipped.
    value: ${{ steps.action.outputs.reason }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/coverage-policy
    with:
      explicit: ${{ inputs.explicit }}
