<rect x="40" y="40" width="1200" height="560" rx="28" fill="#111827" stroke="#30363D" stroke-width="2"/>
<g transform="translate(90 100) scale(2.5)"><svg x="0" y="0" width="64" height="64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CI-esta">
  <title>CI-esta</title>
