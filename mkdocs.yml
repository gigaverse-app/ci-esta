site_name: CI-esta
site_description: Measure GitHub Actions critical paths, cache Python environments,
  and verify CI improvements.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://ci-esta.readthedocs.io/en/latest/"]
repo_url: https://github.com/gigaverse-app/ci-esta
repo_name: gigaverse-app/ci-esta
edit_uri: ''
docs_dir: documentation
site_dir: site
strict: true
exclude_docs: '*.py

  *.txt

  *.in

  overrides/

  '
theme:
  name: material
  custom_dir: documentation/overrides
  language: en
  font: false
  palette:
    primary: teal
    accent: cyan
  features:
  - navigation.sections
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
hooks:
- documentation/hooks.py
markdown_extensions:
- admonition
- attr_list
- tables
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
extra:
  published_sources:
  - docs/tutorials/measure-critical-path.md
  - docs/actions.md
  - docs/agents.md
  - docs/alternatives.md
  - docs/benchmarks/2026-10-22-selective-report.md
  - docs/benchmarks/2026-10-22.md
  - docs/benchmarks/2026-10-23-critical-execution.md
  - docs/benchmarks/2026-10-23-critical-path.md
  - docs/benchmarks/2026-10-23-toolkit.md
  - docs/benchmarks/2026-10-23-windows-saleor.md
  - docs/benchmarks/2026-10-23-windows-saleor/saleor-after-timeline.md
  - docs/benchmarks/2026-10-23-windows-saleor/saleor-warm-before-timeline.md
  - docs/bun-test-selection.md
  - docs/ci-optimization.md
  - docs/critical-path-optimizations.md
  - docs/critical-path.md
  - docs/environment-cache.md
  - docs/evidence-reuse.md
  - docs/github-actions-observability.md
  - docs/integrations.md
  - docs/learned-test-timings.md
  - docs/measured-impact.md
  - docs/non-python.md
  - docs/postgres-client.md
  - docs/python-ci-tuning.md
  - docs/quickstart.md
  - docs/runners-and-diagnostics.md
  - docs/selected-gates.md
  - docs/validation.md
  - CONTRIBUTING.md
  - RELEASING.md
nav:
- Start here: index.md
- Measure the actual critical path: docs/tutorials/measure-critical-path.md
- Quickstart: docs/quickstart.md
- Guides:
  - Actions: docs/actions.md
  - Agents: docs/agents.md
  - Alternatives: docs/alternatives.md
  - Bun test selection: docs/bun-test-selection.md
  - Ci optimization: docs/ci-optimization.md
  - Critical path optimizations: docs/critical-path-optimizations.md
  - Critical path: docs/critical-path.md
  - Environment cache: docs/environment-cache.md
  - Evidence reuse: docs/evidence-reuse.md
  - Github actions observability: docs/github-actions-observability.md
  - Integrations: docs/integrations.md
  - Learned test timings: docs/learned-test-timings.md
  - Measured impact: docs/measured-impact.md
  - Non python: docs/non-python.md
  - Postgres client: docs/postgres-client.md
  - Python ci tuning: docs/python-ci-tuning.md
  - Runners and diagnostics: docs/runners-and-diagnostics.md
  - Selected gates: docs/selected-gates.md
  - Validation: docs/validation.md
- Evidence:
  - 2026 10 22 selective report: docs/benchmarks/2026-10-22-selective-report.md
  - 2026 10 22: docs/benchmarks/2026-10-22.md
  - 2026 10 23 critical execution: docs/benchmarks/2026-10-23-critical-execution.md
  - 2026 10 23 critical path: docs/benchmarks/2026-10-23-critical-path.md
  - 2026 10 23 toolkit: docs/benchmarks/2026-10-23-toolkit.md
  - 2026 10 23 windows saleor: docs/benchmarks/2026-10-23-windows-saleor.md
  - saleor after timeline: docs/benchmarks/2026-10-23-windows-saleor/saleor-after-timeline.md
