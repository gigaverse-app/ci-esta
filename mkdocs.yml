site_name: CI-esta
site_description: Measure GitHub Actions critical paths, cache Python environments,
  and verify CI improvements.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://ci-esta.readthedocs.io/en/latest/"]
repo_url: https://github.com/gigaverse-app/ci-esta
repo_name: gigaverse-app/ci-esta
edit_uri: ''
docs_dir: documentation
site_dir: site
strict: true
exclude_docs: '*.py

  *.txt

  *.in

  overrides/

  '
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.png
  custom_dir: documentation/overrides
  language: en
  font: false
  palette:
    primary: teal
    accent: cyan
  features:
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
hooks:
- documentation/hooks.py
markdown_extensions:
- admonition
- attr_list
- tables
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
extra:
  published_sources:
  - docs/tutorials/measure-critical-path.md
  - docs/actions.md
  - docs/agents.md
  - docs/alternatives.md
  - docs/benchmarks/2026-10-22.md
  - docs/benchmarks/2026-10-23-critical-execution.md
  - docs/benchmarks/2026-10-23-toolkit.md
  - docs/benchmarks/2026-10-23-windows-saleor.md
  - docs/bun-test-selection.md
  - docs/ci-optimization.md
  - docs/critical-path-optimizations.md
  - docs/critical-path.md
  - docs/environment-cache.md
  - docs/evidence-reuse.md
  - docs/github-actions-observability.md
  - docs/integrations.md
  - docs/learned-test-timings.md
  - docs/measured-impact.md
  - docs/non-python.md
  - docs/postgres-client.md
  - docs/python-ci-tuning.md
  - docs/quickstart.md
  - docs/runners-and-diagnostics.md
  - docs/selected-gates.md
  - CONTRIBUTING.md
  - RELEASING.md
nav:
- Home: index.md
- Getting started:
  - Quickstart: docs/quickstart.md
  - Measure your CI critical path: docs/tutorials/measure-critical-path.md
  - Plan a CI optimization: docs/ci-optimization.md
  - Let your agent set it up: docs/agents.md
- Measure and diagnose:
  - Workflow reports and metrics: docs/github-actions-observability.md
  - Critical-path analysis: docs/critical-path.md
  - Report before-and-after impact: docs/measured-impact.md
  - Runner capacity and hang diagnostics: docs/runners-and-diagnostics.md
- Optimize safely:
  - Shorten blocking jobs: docs/critical-path-optimizations.md
  - Cache Python environments: docs/environment-cache.md
  - Tune Python test execution: docs/python-ci-tuning.md
  - Balance tests with timing data: docs/learned-test-timings.md
  - Reuse successful job evidence: docs/evidence-reuse.md
  - Validate skipped test lanes: docs/selected-gates.md
- Actions and integrations:
  - GitHub Actions reference: docs/actions.md
  - Non-Python projects: docs/non-python.md
  - Bun test selection: docs/bun-test-selection.md
  - PostgreSQL client setup: docs/postgres-client.md
  - Combine the four tools: docs/integrations.md
  - Related tools: ecosystem.md
  - Compare alternatives: docs/alternatives.md
- Benchmarks and evidence:
  - CI routing and reporting results: docs/benchmarks/2026-10-22.md
  - Toolkit adoption and critical paths: docs/benchmarks/2026-10-23-toolkit.md
  - Parallel conformance test results: docs/benchmarks/2026-10-23-critical-execution.md
  - Windows and Saleor bottleneck fixes: docs/benchmarks/2026-10-23-windows-saleor.md
- Contributing:
  - Development setup: CONTRIBUTING.md
  - Releasing: RELEASING.md
  - Documentation publishing: publishing.md
