[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ci-esta"
version = "1.5.1"
description = "GitHub Actions observability and evidence-based CI reuse"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Gigaverse"}]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3", "defusedxml>=0.7,<1", "pyyaml>=6,<7", "filelock>=4.2.1,<5"]
keywords = ["github-actions", "ci-observability", "ci-optimization", "continuous-integration", "prometheus"]
classifiers = ["Intended Audience :: Developers", "Topic :: Software Development :: Build Tools", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
selection = ["pytest-selective>=0.4.1,<0.5.0"]
pytest = ["pytest>=8", "pytest-selective>=0.4.1,<0.5.0"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
ci-esta-test-policy = "ci_esta.policy.cli:main"
ci-esta-postgres-clone = "ci_esta.testing.postgres:main"
ci-esta-resources = "ci_esta.diagnostics:main"
ci-esta = "ci_esta.cli:main"
ci-esta-pytest = "ci_esta.testing.cli:main"
ci-esta-image = "ci_esta.image_evidence.cli:main"
ci-esta-drill = "ci_esta.drill:main"
ci-esta-enrich = "ci_esta.ci_observability.enrichment.cli:main"

[project.urls]
Homepage = "https://github.com/gigaverse-app/ci-esta"
Documentation = "https://ci-esta.readthedocs.io/en/latest/"
Repository = "https://github.com/gigaverse-app/ci-esta"
Issues = "https://github.com/gigaverse-app/ci-esta/issues"

[dependency-groups]
dev = ["pytest-selective>=0.4.1,<0.5.0", "pytest>=8", "pytest-xdist>=3.6", "ruff>=0.14", "pyyaml>=6", "build>=1.2", "import-linter>=2.5,<3", "psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_esta"]

[tool.hatch.build.targets.sdist]
include = ["actions", "src", "tests", "scripts", ".github", "docs", "examples", "README.md", "CONTRIBUTING.md", "PROVENANCE.md", "RELEASING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock", "importlinter.toml", ".gitattributes"]

[tool.hatch.build.targets.wheel.force-include]
"actions" = "ci_esta/_resources/actions"
"scripts/ci" = "ci_esta/_resources/scripts/ci"
"pyproject.toml" = "ci_esta/_resources/pyproject.toml"
"uv.lock" = "ci_esta/_resources/uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
