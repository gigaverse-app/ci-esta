# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Update pytest canary PR state
description: Add or clear the server-side pytest-red label only when the caller's tested commit is still the pull request
  head. Callers decide from terminal JUnit evidence when to mark red; only the authoritative full matrix may mark green.
inputs:
  state:
    description: Desired authoritative state, either red or green.
    required: true
  expected-head-sha:
    description: Tested commit SHA; stale runs leave state unchanged.
    required: true
  pull-request-number:
    description: Pull request whose state should be updated.
    required: true
  github-token:
    description: Token with pull-request write permission.
    required: false
    default: ${{ github.token }}
  label:
    description: Server-side label used to admit the next canary run.
    required: false
    default: ci:pytest-red
outputs:
  changed:
    description: Whether this invocation added or removed the label.
    value: ${{ steps.action.outputs.changed }}
  stale:
    description: Whether the expected SHA was no longer the pull request head.
    value: ${{ steps.action.outputs.stale }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/pytest-canary-pr-state
    with:
      state: ${{ inputs.state }}
      expected-head-sha: ${{ inputs.expected-head-sha }}
      pull-request-number: ${{ inputs.pull-request-number }}
      github-token: ${{ inputs.github-token }}
      label: ${{ inputs.label }}
