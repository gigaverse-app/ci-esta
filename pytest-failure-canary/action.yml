# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Plan previous pytest failure canary
description: Select whole test files with terminal failures from available prior-run JUnit artifacts.
inputs:
  artifact-directory:
    description: Directory containing downloaded JUnit shard artifacts from the prior failed run.
    required: true
  junit-pattern:
    description: Glob relative to artifact-directory for JUnit XML files.
    required: true
  junit-name-template:
    description: Expected shard report basename with one {shard} placeholder.
    required: false
    default: junit-group-{shard}.xml
  shard-count:
    description: Expected prior-run JUnit artifact count, used to report completeness.
    required: true
  max-files:
    description: Maximum whole failing files to include in the canary.
    required: false
    default: '5'
  working-directory:
    description: Current consumer checkout used to discard deleted, renamed, or escaping test paths.
    required: false
    default: .
  output:
    description: Newline-delimited pytest path file to write.
    required: false
    default: pytest-failure-canary.txt
outputs:
  canary-file:
    description: Newline-delimited file containing pytest paths.
    value: ${{ steps.action.outputs.canary-file }}
  selected-file-count:
    description: Number of whole test files selected for the bounded canary.
    value: ${{ steps.action.outputs.selected-file-count }}
  failing-file-count:
    description: Number of distinct files with terminal failures in the prior run.
    value: ${{ steps.action.outputs.failing-file-count }}
  terminal-failure-count:
    description: Number of failed or errored testcases observed in valid reports, including unrunnable paths.
    value: ${{ steps.action.outputs.terminal-failure-count }}
  has-files:
    description: Whether the prior reports contain runnable failed test files.
    value: ${{ steps.action.outputs.has-files }}
  truncated:
    description: Whether the file cap omitted any runnable prior failing files.
    value: ${{ steps.action.outputs.truncated }}
  report-count:
    description: Number of prior-run JUnit shard reports found.
    value: ${{ steps.action.outputs.report-count }}
  valid-report-count:
    description: Number of safely parsed JUnit shard reports.
    value: ${{ steps.action.outputs.valid-report-count }}
  invalid-report-count:
    description: Number of found reports that were malformed, unsafe, or not JUnit XML.
    value: ${{ steps.action.outputs.invalid-report-count }}
  distinct-shard-count:
    description: Number of expected shard report identities found without assuming raw count means completeness.
    value: ${{ steps.action.outputs.distinct-shard-count }}
  stale-file-count:
    description: Number of prior failing paths absent from the current checkout.
    value: ${{ steps.action.outputs.stale-file-count }}
  invalid-path-count:
    description: Number of terminal testcases whose paths were missing or unsafe.
    value: ${{ steps.action.outputs.invalid-path-count }}
  artifacts-complete:
    description: Whether every expected shard basename was found exactly once and parsed safely.
    value: ${{ steps.action.outputs.artifacts-complete }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/pytest-failure-canary
    with:
      artifact-directory: ${{ inputs.artifact-directory }}
      junit-pattern: ${{ inputs.junit-pattern }}
      junit-name-template: ${{ inputs.junit-name-template }}
      shard-count: ${{ inputs.shard-count }}
      max-files: ${{ inputs.max-files }}
      working-directory: ${{ inputs.working-directory }}
      output: ${{ inputs.output }}
