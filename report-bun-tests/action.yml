# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Report custom Bun execution
description: Convert an existing Bun runner's measured execution document into CI-esta work-selection evidence. Does not select
  or execute tests.
inputs:
  execution-file:
    description: JSON file matching the run-bun-tests execution shape (mode, reason, testedSha, bunVersion, totalFiles, executedFiles,
      durationMs, exitCode).
    required: true
  output-file:
    description: Provider-neutral work-selection JSON output.
    default: ci-work-selection.json
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/report-bun-tests
    with:
      execution-file: ${{ inputs.execution-file }}
      output-file: ${{ inputs.output-file }}
