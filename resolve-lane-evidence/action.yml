# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Resolve independent validation evidence
description: Reuse successful first-attempt lanes for the identical tested PR merge tree.
inputs:
  lanes:
    description: JSON object mapping output keys to exact job names.
    required: true
  execution-context:
    description: 'Optional deterministic description of runtime-selected work, such as the selected test lanes. Different
      values require different receipts. Keep job names stable: any later failed execution of that job conservatively revokes
      earlier proof.'
    default: ''
  input-paths:
    description: Optional JSON array of complete repository-relative execution inputs. When set, receipts bind these files/directories
      from the tested merge instead of the entire tree. Include workflow, setup scripts, dependency locks and upstream revision
      pins. Unchanged inputs still require a proven passing lane; a path match alone never skips.
    default: '[]'
  dependency-token:
    description: Read access to backend-common. With it, a backend-common pin counts as the tree it installs, so a retag between
      commits of one tree (PR<N> to v<N>) reuses every lane. Without it pins are compared exactly.
    default: ''
outputs:
  receipt:
    description: Completion step name binding consumer merge tree and downloaded shared tooling.
    value: ${{ steps.action.outputs.receipt }}
  reused:
    description: JSON object of positively proven lane keys.
    value: ${{ steps.action.outputs.reused }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/resolve-lane-evidence
    with:
      lanes: ${{ inputs.lanes }}
      execution-context: ${{ inputs.execution-context }}
      input-paths: ${{ inputs.input-paths }}
      dependency-token: ${{ inputs.dependency-token }}
