# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Resolve security trigger
description: 'Decide whether a security workflow (Trivy, Semgrep, ...) should run, based on the same triggers the non-default
  test framework uses: a PR label, a write+ collaborator PR comment, a push, or a manual dispatch. Consumers may also opt
  into automatic same-repository pull requests. Emits should_run, ref, pr_number and mode so consumers don''t re-implement
  the (subtle) permission and fork-safety logic in every security workflow.

  '
inputs:
  source-excluded-paths:
    description: Newline-separated directories already owned by the CI security lane; excludes only diff source scans.
    default: ''
  inventory-job-name:
    description: Independent inventory completion job; enables input-bound evidence.
    default: ''
  inventory-inputs:
    description: Newline-separated literal inventory files and directories; defaults to dependency-paths.
    default: ''
  dependency-token:
    description: Read token for resolving equivalent backend-common package pins.
    default: ''
  changes-file:
    description: Optional complete JSON file evidence bound to the resolved base and head; invalid evidence retains all scans.
    default: ''
  security-label:
    description: PR label that opts a PR into the scan.
    required: false
    default: risk:security
  require-same-repo:
    description: 'When ''true'', refuse to run for PRs from forks (head repo != this repo). Set this for scans that build
      images and therefore need same-repo build secrets (Trivy); leave ''false'' for read-only source scans (Semgrep).

      '
    required: false
    default: 'false'
  automatic-same-repo-pull-requests:
    description: 'When ''true'', run automatically for opened, reopened and synchronized pull requests, including drafts,
      whose head branch belongs to this repository. Readiness changes allocate no validation. Bot and fork PRs remain excluded.
      The default keeps the existing label/comment opt-in policy unchanged.

      '
    required: false
    default: 'false'
  unchanged-dependency-paths:
    description: 'Whitespace-separated dependency paths proven not to change what is installed, such as a lock whose only
      edit moves a first-party pin between byte-identical trees (test-impact''s dependencies-unchanged). They stop counting
      as dependency changes, but only for `unchanged-dependency-base`: a proof against another base says nothing about this
      diff.'
    default: ''
  unchanged-dependency-base:
    description: The base the unchanged-dependency proof was made against (test-impact's `base` output).
    default: ''
  incremental-evidence:
    description: '''false'' skips the search for an earlier same-PR run whose scan can shrink the diff, and diffs from the
      PR base instead. For callers that read only should_run (an image gate), the search is pure latency: it lists and inspects
      every earlier run of the workflow.'
    default: 'true'
  automatic-pr-evidence-step-name:
    description: Optional successful top-level step required inside a combined evidence job; prevents skipped scans being
      reused.
    default: ''
  automatic-pr-evidence-job-name:
    description: 'Stable job name or reusable-workflow suffix that proves an earlier automatic PR security run actually scanned
      code. A workflow-level success with all scan jobs skipped is not reusable evidence.

      '
    required: false
    default: semgrep-oss/scan
  automatic-pr-cancelled-evidence-job-patterns:
    description: 'Newline-delimited job-name globs that must all have succeeded before a cancelled automatic PR workflow can
      be reused. The defaults require both Semgrep and Trivy, independent of consumer-specific job prefixes.

      '
    required: false
    default: '*Semgrep*

      *Trivy*

      '
  automatic-pr-ignored-paths:
    description: 'Newline-delimited exact paths that cannot change a scanner verdict. Automatic PR deltas containing only
      these generated metadata files emit semgrep_changed=false before the Semgrep runner is allocated.

      '
    required: false
    default: '.github/backend-common-bump.json

      .github/backend-common-ref

      '
  dependency-paths:
    description: "Newline-delimited path patterns (exact paths, `dir/` prefixes, or globs with `*`/`**`) that define a scan's\
      \ dependency inputs \u2014 lockfiles, Dockerfiles, package manifests. When set, the action compares the diff of routine\
      \ events (push, automatic same-repo PRs) against these patterns and emits deps_changed so inventory scans (Trivy) can\
      \ skip runs whose inputs did not move. Explicit requests (label, comment, dispatch, schedule) always emit deps_changed=true:\
      \ a human asking for a scan gets the full answer. Empty (the default) also always emits true, so callers that don't\
      \ opt in keep their current behavior.\n"
    required: false
    default: ''
  prose-paths:
    description: 'Known prose paths (exact paths, directory prefixes, or globs). A complete prose-only diff still requires
      secret detection but not source analysis. Runtime prompts/templates are deliberately not included by default.

      '
    required: false
    default: 'docs/**/*.md

      plugins/**/SKILL.md

      .agents/skills/**/*.md

      .claude/skills/**/*.md

      '
  github-token:
    description: 'Token used for collaborator checks and prior-run discovery. Automatic PR mode requires actions:read, checks:read,
      and contents:read.

      '
    required: false
    default: ${{ github.token }}
outputs:
  inventory-receipt:
    description: Step name to record only after every inventory scan succeeds.
    value: ${{ steps.action.outputs.inventory-receipt }}
  should_run:
    description: '''true'' if the scan should run for this event.'
    value: ${{ steps.action.outputs.should_run }}
  ref:
    description: Git ref/SHA the scan should check out (PR head for PR triggers).
    value: ${{ steps.action.outputs.ref }}
  pr_number:
    description: PR number when triggered from a PR (label/comment), else ''.
    value: ${{ steps.action.outputs.pr_number }}
  mode:
    description: 'One of: pull_request, label, comment, push, manual, schedule, '''' (no run).'
    value: ${{ steps.action.outputs.mode }}
  same_repo:
    description: '''true'' when the target ref belongs to this repository.'
    value: ${{ steps.action.outputs.same_repo }}
  scope:
    description: '''diff'' when the event carries an exact previous state to compare against (push with a valid before-SHA,
      automatic same-repo PRs), ''full'' otherwise (label, comment, manual, schedule). Diff-scoped SAST is exact for "did
      this change introduce a finding" because Semgrep CE findings are per-file; pair it with a scheduled full scan to cover
      registry ruleset drift against unchanged code.

      '
    value: ${{ steps.action.outputs.scope }}
  base_sha:
    description: Diff base for scope=diff, else ''.
    value: ${{ steps.action.outputs.base_sha }}
  deps_changed:
    description: '''false'' only when dependency-paths was provided, the event is diff-scoped, and the diff verifiably touches
      none of the dependency paths. Any uncertainty (full scope, API failure, truncated file list) fails open to ''true''.

      '
    value: ${{ steps.action.outputs.deps_changed }}
  semgrep_changed:
    description: '''false'' only when an automatic PR diff is complete and contains no added, modified, or renamed file outside
      automatic-pr-ignored-paths. Uncertainty and explicit/full scans fail open to ''true''.

      '
    value: ${{ steps.action.outputs.semgrep_changed }}
  source_changed:
    description: Whether source rules are needed in addition to secret detection.
    value: ${{ steps.action.outputs.source_changed }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/resolve-security-trigger
    with:
      source-excluded-paths: ${{ inputs.source-excluded-paths }}
      inventory-job-name: ${{ inputs.inventory-job-name }}
      inventory-inputs: ${{ inputs.inventory-inputs }}
      dependency-token: ${{ inputs.dependency-token }}
      changes-file: ${{ inputs.changes-file }}
      security-label: ${{ inputs.security-label }}
      require-same-repo: ${{ inputs.require-same-repo }}
      automatic-same-repo-pull-requests: ${{ inputs.automatic-same-repo-pull-requests }}
      unchanged-dependency-paths: ${{ inputs.unchanged-dependency-paths }}
      unchanged-dependency-base: ${{ inputs.unchanged-dependency-base }}
      incremental-evidence: ${{ inputs.incremental-evidence }}
      automatic-pr-evidence-step-name: ${{ inputs.automatic-pr-evidence-step-name }}
      automatic-pr-evidence-job-name: ${{ inputs.automatic-pr-evidence-job-name }}
      automatic-pr-cancelled-evidence-job-patterns: ${{ inputs.automatic-pr-cancelled-evidence-job-patterns }}
      automatic-pr-ignored-paths: ${{ inputs.automatic-pr-ignored-paths }}
      dependency-paths: ${{ inputs.dependency-paths }}
      prose-paths: ${{ inputs.prose-paths }}
      github-token: ${{ inputs.github-token }}
