# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Scan source with Semgrep
description: Run source and secret checks on an existing Docker-capable runner.
inputs:
  github-token:
    description: Read-only contents token used only for the private diff-base fetch; never persisted.
    default: ${{ github.token }}
  configs:
    description: Space-separated semgrep registry configs (each becomes --config).
    required: false
    default: p/default p/python p/security-audit p/owasp-top-ten p/dockerfile p/secrets
  severity:
    description: Minimum severity that fails the scan.
    required: false
    default: ERROR
  exclude:
    description: Space-separated path globs to exclude (each becomes --exclude).
    required: false
    default: .devcontainer
  diff-exclude:
    description: CI-owned paths omitted only from routine diff scans; full scans retain them.
    default: ''
  exclude-rules:
    description: Space-separated rule ids to exclude (each becomes --exclude-rule).
    required: false
    default: dockerfile.security.missing-user-entrypoint.missing-user-entrypoint javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
  extra-exclude-rules:
    description: Additional space-separated rule ids appended to the shared exclusions.
    required: false
    default: ''
  scan-scope:
    description: Diff or full scan.
    default: full
  base-sha:
    description: Proven diff base; missing evidence falls back to full scan.
    default: ''
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/semgrep-scan
    with:
      github-token: ${{ inputs.github-token }}
      configs: ${{ inputs.configs }}
      severity: ${{ inputs.severity }}
      exclude: ${{ inputs.exclude }}
      diff-exclude: ${{ inputs.diff-exclude }}
      exclude-rules: ${{ inputs.exclude-rules }}
      extra-exclude-rules: ${{ inputs.extra-exclude-rules }}
      scan-scope: ${{ inputs.scan-scope }}
      base-sha: ${{ inputs.base-sha }}
